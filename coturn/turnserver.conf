# coturn config for myserver's self-hosted STUN/TURN (MYAG-219).
#
# No secret lives in this file. The shared secret, realm, and external IP are
# injected at container start from env vars (see docker-compose.yml.myserver's
# coturn service) so they never end up in a committed file.
#
# Credential mechanism: coturn's standard "REST API" time-limited scheme --
# lt-cred-mech + use-auth-secret means a client never gets a permanent
# username/password. The backend (MYAG-218-BE) computes a short-lived
# username="<expiry-unix-ts>" and password=base64(HMAC-SHA1(secret, username))
# per call, and only that pair is ever handed to the frontend.

listening-port=3478
# coturn listens on this same port number for both UDP and TCP (TCP as a
# fallback for restrictive networks that block/throttle UDP) unless one
# transport is explicitly disabled -- neither is, here.

# Deliberately narrow relay range (13 ports) rather than coturn's huge
# default (49152-65535) -- keep the firewall/router surface small. Widen
# later only if call volume needs more concurrent relayed calls than this
# supports.
min-port=49160
max-port=49172

fingerprint
lt-cred-mech
use-auth-secret

# No TURN over TLS/DTLS for this pass -- everything else in this app is
# terminated at the Cloudflare Tunnel edge, but the tunnel can't carry raw
# UDP, so coturn is exposed directly and TLS certs aren't wired up for it
# yet. The call media itself is still protected by WebRTC's own mandatory
# DTLS-SRTP regardless of how the TURN control channel is secured.
no-tls
no-dtls

no-cli
no-multicast-peers
no-loopback-peers

# Refuse to relay to RFC1918/loopback/link-local/multicast ranges so this
# open relay can't be abused to reach myserver's own LAN or other internal
# hosts -- standard coturn hardening, taken from coturn's own example config.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Abuse/DoS guardrails -- one relay allocation per call, not unbounded.
stale-nonce=600
total-quota=100
user-quota=50
max-bps=1000000

# realm / static-auth-secret / external-ip are passed on the command line
# from env vars by docker-compose.yml.myserver -- do not hardcode them here.
