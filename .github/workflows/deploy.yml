name: Deployment ownership

on:
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-location:
    name: Report deployment owner
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment ownership
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deployment is managed by HGPT

          This repository runs its own CI. It does not deploy myhai.org.
          The live checkout and Bigserver runner belong to `sudheer-050/Hgpt`.
          Deploy changes through that repository's staging/master branches:
          https://github.com/sudheer-050/Hgpt/actions/workflows/deploy.yml

          No production or staging deployment was performed by this run.
          SUMMARY
