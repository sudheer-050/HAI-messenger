# Mirrors production's Cloudflare Tunnel path-based routing (see
# cloudflared/config.yml.myserver) so localhost behaves like myhai.org:
# one origin, /analyst/* goes to the Auto Data Analyst app, everything
# else goes to the chat backend. Local dev convenience only -- not part
# of the deployed stack.
events {}

http {
    server {
        listen 80;

        # host.docker.internal resolves to the Windows host from inside a
        # container, which is where run_local.py's dev server (port 5000,
        # mounted at /analyst via wsgi.py's DispatcherMiddleware) is running --
        # it isn't a docker-compose service, so it can't be reached by name.
        location /analyst/ {
            proxy_pass http://host.docker.internal:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
