<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>H AI — HAI Messenger</title>
    <meta name="description" content="Talk to H, HAI Messenger's AI assistant — in text or voice.">
    <link rel="icon" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #09090b;
            --bg-sidebar: #18181b;
            --accent-brand: #9B8AFB;
            --accent-brand-hover: #8171E8;
            --text-normal: #fafafa;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
            --glass-blur: blur(20px) saturate(180%);
            --glass-weak: rgba(255, 255, 255, 0.06);
            --glass-strong: rgba(255, 255, 255, 0.09);
            --glass-border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: var(--font-stack);
            background: var(--bg-main);
            color: var(--text-normal);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-link {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%;
            color: var(--text-muted); text-decoration: none; flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .back-link:hover {
            background: var(--glass-weak);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text-normal);
        }
        .header-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--accent-brand);
            display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0;
        }
        .header-left .name { font-weight: 700; font-size: 15px; }
        .header-left .sub { font-size: 11.5px; color: var(--text-muted); }
        .header-right { display: flex; justify-content: flex-end; }
        .history-toggle-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .history-toggle-btn:hover, .history-toggle-btn.active {
            background: var(--glass-weak);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: var(--accent-brand);
        }
        .history-toggle-btn svg { width: 18px; height: 18px; }

        /* MODE TOGGLE -- centered, morphing pill indicator slides between the two
           labels instead of the background just flipping instantly. Liquid Glass:
           blurred/saturated translucent track (matches .status-fab-tray in
           index.html) with a colored glass indicator pill carrying its own
           specular highlight, rather than a flat solid fill. */
        .mode-toggle {
            position: relative;
            display: flex;
            background: var(--glass-weak);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 3px;
            width: 148px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        .mode-toggle-indicator {
            position: absolute;
            top: 3px; left: 3px;
            width: calc(50% - 3px);
            height: calc(100% - 6px);
            background: linear-gradient(135deg, rgba(155, 138, 251, 0.95), rgba(129, 113, 232, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 4px 14px rgba(108, 93, 211, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .mode-toggle.voice .mode-toggle-indicator { transform: translateX(calc(100% + 2px)); }
        .mode-toggle button {
            position: relative; z-index: 1; flex: 1; border: none; background: transparent;
            color: var(--text-muted); font-family: var(--font-stack); font-size: 12.5px; font-weight: 600;
            padding: 7px 0; border-radius: 999px; cursor: pointer; transition: color 0.2s ease;
        }
        .mode-toggle button.active { color: #fff; }

        main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

        /* ---- TEXT MODE ---- */
        #textMode { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 720px; width: 100%; margin: 0 auto; }
        #textMessages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 78%; padding: 10px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-self: flex-end; background: var(--accent-brand); color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: var(--glass-weak); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        .msg.error { align-self: flex-start; background: rgba(218, 55, 60, 0.15); color: #f28b8e; border-bottom-left-radius: 4px; }
        .typing-indicator { align-self: flex-start; display: flex; gap: 4px; padding: 12px 15px; background: var(--glass-weak); border: 1px solid var(--glass-border); border-radius: 16px; border-bottom-left-radius: 4px; }
        .typing-indicator span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

        /* Teach-H clarification prompt, shown when she flags an unfamiliar term. */
        .teach-card {
            align-self: flex-start; max-width: 82%; background: rgba(155, 138, 251, 0.1);
            border: 1px solid var(--accent-brand); border-radius: 16px; border-bottom-left-radius: 4px;
            padding: 12px 15px; font-size: 13.5px; display: flex; flex-direction: column; gap: 8px;
        }
        .teach-card input {
            border-radius: 10px; border: 1px solid var(--border-color); background: var(--glass-weak);
            color: var(--text-normal); font-family: var(--font-stack); font-size: 13px; padding: 8px 10px; outline: none;
        }
        .teach-card input:focus { border-color: var(--accent-brand); }
        .teach-card-actions { display: flex; gap: 8px; }
        .teach-card button {
            border: none; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: var(--font-stack);
        }
        .teach-card .teach-save { background: var(--accent-brand); color: #fff; }
        .teach-card .teach-skip { background: var(--glass-weak); color: var(--text-muted); }

        .input-row { display: flex; align-items: flex-end; gap: 10px; padding: 16px 20px 20px; }
        #textInput {
            flex: 1; resize: none; max-height: 140px; min-height: 44px;
            padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border-color);
            background: var(--glass-weak); color: var(--text-normal);
            font-family: var(--font-stack); font-size: 14.5px; line-height: 1.4; outline: none;
        }
        #textInput:focus { border-color: var(--accent-brand); }
        #textSendBtn {
            width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
            background: var(--accent-brand); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #textSendBtn:hover { background: var(--accent-brand-hover); }
        #textSendBtn:disabled { opacity: 0.5; cursor: default; }
        #textSendBtn svg { width: 17px; height: 17px; }

        /* ---- VOICE MODE ---- */
        #voiceMode { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; }
        .orb-wrap { width: 220px; height: 220px; border-radius: 50%; position: relative; }
        #voiceCanvas { width: 100%; height: 100%; display: block; }
        .voice-status { font-size: 15px; color: var(--text-muted); min-height: 20px; text-align: center; max-width: 480px; }
        .voice-transcript { font-size: 17px; font-weight: 500; text-align: center; max-width: 560px; min-height: 26px; padding: 0 20px; }

        /* Orb reacts to conversation state -- dim/grayscale while idle or muted
           (nothing is being heard), full brightness once actually listening,
           thinking, or speaking -- so the "is H paying attention right now"
           answer is visible at a glance, Jarvis/ChatGPT-voice style. */
        .orb-wrap { transition: opacity 0.25s ease, filter 0.25s ease; }
        .orb-wrap.state-idle, .orb-wrap.state-muted { opacity: 0.4; filter: grayscale(0.7); }
        .orb-wrap.state-listening, .orb-wrap.state-thinking, .orb-wrap.state-speaking { opacity: 1; filter: none; }

        /* FLOATING VOICE CONTROL BAR -- draggable pill (mute / mic / end), fixed
           to the viewport so dragging is independent of page scroll/layout. */
        .voice-control-bar {
            position: fixed;
            left: 50%; bottom: 36px;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(24, 24, 27, 0.78);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 40;
            user-select: none;
        }
        .vcb-drag-handle {
            width: 16px; height: 32px; margin-right: 2px;
            display: grid; grid-template-columns: repeat(2, 3px); grid-auto-rows: 3px; gap: 3px;
            align-content: center; justify-content: center;
            cursor: grab; touch-action: none; flex-shrink: 0;
        }
        .vcb-drag-handle span { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
        .voice-control-bar.dragging { transition: none; }
        .voice-control-bar.dragging .vcb-drag-handle { cursor: grabbing; }
        .vcb-btn {
            position: relative; border: none; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #fff; flex-shrink: 0;
            transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
        }
        .vcb-btn svg { width: 19px; height: 19px; pointer-events: none; }
        .vcb-mute { width: 42px; height: 42px; background: var(--glass-strong); color: var(--text-normal); }
        .vcb-mute:hover { background: var(--glass-weak); }
        .vcb-mute.is-muted { background: rgba(218, 55, 60, 0.18); color: #f28b8e; }
        .vcb-mic {
            width: 58px; height: 58px;
            background: linear-gradient(145deg, var(--accent-brand), var(--accent-brand-hover));
        }
        .vcb-mic:hover { transform: scale(1.05); }
        .vcb-mic.is-listening { animation: vcbPulse 1.4s ease-out infinite; }
        .vcb-mic.is-speaking { background: linear-gradient(145deg, #6fd6a8, #38b479); }
        .vcb-mic.is-muted-state { background: var(--glass-strong); opacity: 0.55; }
        @keyframes vcbPulse {
            0% { box-shadow: 0 0 0 0 rgba(155, 138, 251, 0.55); }
            70% { box-shadow: 0 0 0 16px rgba(155, 138, 251, 0); }
            100% { box-shadow: 0 0 0 0 rgba(155, 138, 251, 0); }
        }
        .vcb-end { width: 42px; height: 42px; background: #da373c; }
        .vcb-end:hover { background: #c22f34; }

        /* HISTORY / TRANSCRIPT PANEL -- toggled by the header button, positioned
           centered horizontally and low (near the bottom) per request, so it reads
           as a drawer sliding up rather than a top-anchored modal. Liquid Glass:
           translucent blurred surface (matches .status-fab-tray / .setup-card in
           index.html) instead of a flat solid fill, with a specular highlight on
           the top inner edge. backdrop-filter only pays its recomposition cost
           while the drawer is actually open (opacity 0 + pointer-events none the
           rest of the time), so it doesn't add per-frame cost to the orb shader,
           which keeps running underneath at its own rAF pace either way. */
        #historyPanel {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translate(-50%, 16px);
            width: min(520px, calc(100vw - 32px));
            max-height: min(60vh, 480px);
            background: var(--glass-strong);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            z-index: 30;
        }
        #historyPanel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .history-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .history-header span { font-size: 13px; font-weight: 700; }
        .history-header-actions { display: flex; gap: 6px; }
        .history-icon-btn {
            width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .history-icon-btn:hover {
            background: var(--glass-weak);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text-normal);
        }
        .history-icon-btn svg { width: 15px; height: 15px; }
        #historyList { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
        #historyList .msg { max-width: 88%; font-size: 13px; }
        #historyEmpty { font-size: 13px; color: var(--text-muted); text-align: center; padding: 20px 0; }

        @media (max-width: 640px) {
            .header-left .sub { display: none; }
            .orb-wrap { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="back-link" id="hBackLink" aria-label="Back to homepage" title="Back to homepage">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
            <div class="header-avatar">H</div>
            <div>
                <div class="name">H</div>
                <div class="sub">HAI's assistant</div>
            </div>
        </div>

        <div class="mode-toggle" id="modeToggle">
            <div class="mode-toggle-indicator"></div>
            <button type="button" id="textModeBtn" class="active">Text</button>
            <button type="button" id="voiceModeBtn">Voice</button>
        </div>

        <div class="header-right">
            <button type="button" class="history-toggle-btn" id="historyToggleBtn" aria-label="Show conversation history" title="History">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            </button>
        </div>
    </header>

    <main>
        <div id="textMode">
            <div id="textMessages">
                <div class="msg assistant">Hi, I'm H. Ask me anything about HAI Messenger, or whatever's on your mind.</div>
            </div>
            <div class="input-row">
                <textarea id="textInput" placeholder="Message H…" rows="1"></textarea>
                <button id="textSendBtn" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>

        <div id="voiceMode">
            <div class="orb-wrap state-idle"><canvas id="voiceCanvas" width="220" height="220"></canvas></div>
            <div class="voice-transcript" id="voiceTranscript"></div>
            <div class="voice-status" id="voiceStatus">Starting…</div>
        </div>

        <!-- Floating, draggable voice controls -- mute / mic (tap to talk, tap
             again to interrupt H) / end. Fixed to the viewport, not #voiceMode,
             so dragging works independent of scroll/layout. -->
        <div class="voice-control-bar" id="voiceControlBar">
            <div class="vcb-drag-handle" id="voiceDragHandle" title="Drag">
                <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <button type="button" class="vcb-btn vcb-mute" id="voiceMuteBtn" aria-label="Mute microphone" title="Mute">
                <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <svg class="icon-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button type="button" class="vcb-btn vcb-mic" id="voiceMicBtn" aria-label="Tap to talk" title="Tap to talk">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button type="button" class="vcb-btn vcb-end" id="voiceEndBtn" aria-label="End voice chat" title="End">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- HISTORY / TRANSCRIPT PANEL, positioned centered-bottom (see CSS) -->
        <div id="historyPanel">
            <div class="history-header">
                <span>Conversation</span>
                <div class="history-header-actions">
                    <button type="button" class="history-icon-btn" id="downloadHistoryBtn" title="Download conversation">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button type="button" class="history-icon-btn" id="closeHistoryBtn" title="Close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div id="historyList">
                <div id="historyEmpty">No messages yet.</div>
            </div>
        </div>
    </main>

    <script>
        /* Opened from inside the chat app (index.html links here with ?from=app) --
           send the back arrow to the chat list instead of the public landing page,
           since that's where this visitor actually came from. */
        if (new URLSearchParams(location.search).get('from') === 'app') {
            document.getElementById('hBackLink').href = '/index.html';
        }

        /* ============ LEARNING / GLOSSARY (private per-browser, localStorage) ============
           When H flags a term she doesn't understand, the visitor can teach her its
           meaning; it's remembered only in this browser and sent along as extra context
           on future requests -- never shared with other visitors. */
        const GLOSSARY_KEY = 'h_glossary_v1';
        function loadGlossary() {
            try { return JSON.parse(localStorage.getItem(GLOSSARY_KEY) || '[]'); } catch (e) { return []; }
        }
        function saveGlossaryTerm(term, meaning) {
            const glossary = loadGlossary();
            const existing = glossary.find(g => g.term.toLowerCase() === term.toLowerCase());
            if (existing) existing.meaning = meaning;
            else glossary.push({ term, meaning });
            localStorage.setItem(GLOSSARY_KEY, JSON.stringify(glossary));
        }
        // H is asked (system prompt) to say exactly this phrase when a term
        // is unfamiliar, so the frontend can reliably detect it and offer to learn.
        const LEARN_PATTERN = /I'?m not sure what you mean by ['"]([^'"]+)['"]/i;

        /* ============ SHARED: history + backend call ============ */
        let hHistory = [];

        function recordTranscript(role, text) {
            hHistory.push({ role, content: text });
            renderHistoryPanel();
        }

        async function askH(message, { voice = false } = {}) {
            const res = await fetch('/api/h-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, history: hHistory, glossary: loadGlossary(), voice }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Something went wrong.');
            return { reply: data.reply, emotion: data.emotion || 'neutral', audio: data.audio || null };
        }

        // "Thinking" filler audio -- the LLM + TTS round trip is slow enough that
        // silence reads as broken/unresponsive. Pre-synthesized once (same Kokoro
        // voice, so it doesn't clash) and played only if the real reply is taking
        // a noticeable while, same idea as ChatGPT voice's "let me think" beat.
        const H_FILLER_PHRASES = [
            "Hmm, let me think about that for a second.",
            "Good question, give me just a moment.",
            "Let me think that through real quick.",
            "One second, thinking about that.",
            "Give me a moment to work that out.",
            "Let me piece that together.",
            "Okay, thinking about the best way to answer that.",
            "Just a moment, mulling that over.",
            "Let me get that figured out for you.",
            "Hang on, working through that one.",
            "Interesting one -- let me think.",
            "Give me a second to gather my thoughts.",
        ];
        // For a wait that drags on past the first filler and a joke, these read
        // as genuine progress reassurance instead of the same "thinking" beat on
        // loop -- distinct pool so they don't get mixed in with the opening filler.
        const H_ALMOST_THERE_PHRASES = [
            "Almost there, just a moment more.",
            "Just about got it, thanks for hanging in there.",
            "Nearly done thinking this through.",
            "A little more time and I'll have it for you.",
            "Almost ready with an answer.",
            "Just a bit longer, I'm nearly there.",
        ];
        let hFillerAudioObjects = [];
        let hAlmostThereAudioObjects = [];
        let hFillerLoadPromise = null;
        let hLastFillerIndex = -1;
        let hLastAlmostThereIndex = -1;
        function loadHFillerAudio() {
            if (hFillerLoadPromise) return hFillerLoadPromise;
            const synth = text => fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
                .then(r => r.json()).then(d => d.audio || null).catch(() => null);
            hFillerLoadPromise = Promise.all([
                Promise.all(H_FILLER_PHRASES.map(synth)).then(results => { hFillerAudioObjects = results.filter(Boolean); }),
                Promise.all(H_ALMOST_THERE_PHRASES.map(synth)).then(results => { hAlmostThereAudioObjects = results.filter(Boolean); }),
            ]);
            return hFillerLoadPromise;
        }
        // Never repeats the immediately-previous phrase back to back, so a slow
        // reply that needs two or three fillers in a row doesn't sound like a
        // broken record.
        function pickHFillerAudio() {
            if (!hFillerAudioObjects.length) return null;
            if (hFillerAudioObjects.length === 1) return hFillerAudioObjects[0];
            let idx;
            do { idx = Math.floor(Math.random() * hFillerAudioObjects.length); } while (idx === hLastFillerIndex);
            hLastFillerIndex = idx;
            return hFillerAudioObjects[idx];
        }
        function pickHAlmostThereAudio() {
            if (!hAlmostThereAudioObjects.length) return null;
            if (hAlmostThereAudioObjects.length === 1) return hAlmostThereAudioObjects[0];
            let idx;
            do { idx = Math.floor(Math.random() * hAlmostThereAudioObjects.length); } while (idx === hLastAlmostThereIndex);
            hLastAlmostThereIndex = idx;
            return hAlmostThereAudioObjects[idx];
        }

        /* ============ MODE SWITCHING ============ */
        const modeToggle = document.getElementById('modeToggle');
        const textModeBtn = document.getElementById('textModeBtn');
        const voiceModeBtn = document.getElementById('voiceModeBtn');
        const textModeEl = document.getElementById('textMode');
        const voiceModeEl = document.getElementById('voiceMode');

        function switchMode(mode) {
            const toText = mode === 'text';
            textModeEl.style.display = toText ? 'flex' : 'none';
            voiceModeEl.style.display = toText ? 'none' : 'flex';
            voiceControlBar.style.display = toText ? 'none' : 'flex';
            textModeBtn.classList.toggle('active', toText);
            voiceModeBtn.classList.toggle('active', !toText);
            modeToggle.classList.toggle('voice', !toText);
            if (toText) {
                stopVoiceConversation();
            } else {
                voiceMuted = false;
                updateMuteUI();
                initVoiceOrb();
                loadHFillerAudio(); // warm the "let me think" cache before it's needed
                startVoiceConversation(); // auto-starts listening, like ChatGPT voice
            }
        }
        // Mobile browsers (iOS Safari, many Android WebViews) only allow an
        // <audio> element to produce sound if it's first played synchronously
        // inside a user gesture (a tap handler, not an async callback after it).
        // H's real Kokoro audio always arrives later, after an await'd fetch --
        // too late to count as "the gesture" -- so this reuses one Audio element
        // for every turn and unlocks it here with a silent clip, still inside the tap.
        const hVoiceAudio = new Audio();
        hVoiceAudio.preload = 'auto';
        hVoiceAudio.playsInline = true;
        let audioUnlocked = false;
        const SILENT_WAV = 'data:audio/wav;base64,UklGRioAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQYAAACAgICAgA==';
        function unlockAudioForMobile() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            hVoiceAudio.volume = 0;
            hVoiceAudio.src = SILENT_WAV;
            const playAttempt = hVoiceAudio.play();
            if (playAttempt) playAttempt.then(() => {
                // A very fast reply may already have replaced the silent source
                // with real Kokoro audio -- never tear that playback down.
                if (!hVoiceAudio.src.startsWith('data:audio/wav')) return;
                hVoiceAudio.pause();
                hVoiceAudio.currentTime = 0;
                hVoiceAudio.removeAttribute('src');
                hVoiceAudio.load();
                hVoiceAudio.volume = 1;
            }).catch(() => { hVoiceAudio.volume = 1; });
        }
        textModeBtn.addEventListener('click', () => switchMode('text'));
        voiceModeBtn.addEventListener('click', () => { unlockAudioForMobile(); switchMode('voice'); });

        /* ============ TEXT MODE ============ */
        const textMessages = document.getElementById('textMessages');
        const textInput = document.getElementById('textInput');
        const textSendBtn = document.getElementById('textSendBtn');
        let textBusy = false;

        function appendMsg(container, role, text) {
            const el = document.createElement('div');
            el.className = 'msg ' + role;
            el.textContent = text;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
            return el;
        }

        // Shows H's reply, intercepting the "I'm not sure what you mean by X"
        // pattern into an inline teach-H card instead of the raw sentence.
        function presentReply(container, replyText, onTaught) {
            const match = replyText.match(LEARN_PATTERN);
            if (!match) {
                appendMsg(container, 'assistant', replyText);
                return;
            }
            const term = match[1];
            appendMsg(container, 'assistant', replyText);
            const card = document.createElement('div');
            card.className = 'teach-card';
            card.innerHTML = `
                <span>Teach me what "${term.replace(/</g, '&lt;')}" means, and I'll remember it.</span>
                <input type="text" placeholder="e.g. it means…" />
                <div class="teach-card-actions">
                    <button type="button" class="teach-save">Save</button>
                    <button type="button" class="teach-skip">Skip</button>
                </div>
            `;
            const input = card.querySelector('input');
            card.querySelector('.teach-save').addEventListener('click', () => {
                const meaning = input.value.trim();
                if (meaning) { saveGlossaryTerm(term, meaning); if (onTaught) onTaught(term, meaning); }
                card.remove();
            });
            card.querySelector('.teach-skip').addEventListener('click', () => card.remove());
            container.appendChild(card);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const el = document.createElement('div');
            el.className = 'typing-indicator';
            el.id = 'typingIndicator';
            el.innerHTML = '<span></span><span></span><span></span>';
            textMessages.appendChild(el);
            textMessages.scrollTop = textMessages.scrollHeight;
        }
        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        textInput.addEventListener('input', () => {
            textInput.style.height = 'auto';
            textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px';
        });
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMessage(); }
        });
        textSendBtn.addEventListener('click', sendTextMessage);

        async function sendTextMessage() {
            const text = textInput.value.trim();
            if (!text || textBusy) return;
            appendMsg(textMessages, 'user', text);
            textInput.value = '';
            textInput.style.height = 'auto';
            textBusy = true;
            textSendBtn.disabled = true;
            showTyping();
            try {
                const { reply } = await askH(text);
                hideTyping();
                presentReply(textMessages, reply);
                recordTranscript('user', text);
                recordTranscript('assistant', reply);
            } catch (err) {
                hideTyping();
                appendMsg(textMessages, 'error', err.message || "Couldn't reach H.");
            } finally {
                textBusy = false;
                textSendBtn.disabled = false;
            }
        }

        /* ============ VOICE MODE ============ */
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceTranscript = document.getElementById('voiceTranscript');

        let voiceConversationActive = false;
        let voiceRecognition = null;
        let isHSpeaking = false;
        let voiceMuted = false;
        let orbSpeedMultiplier = 1;
        let voiceTurnToken = 0; // guards against overlapping turns -- the fix for the double-voice bug
        let lastSpokenReply = ''; // what H just said out loud -- used to catch her own voice leaking into the mic

        // Without headphones, H's TTS plays through the speakers and the mic picks
        // some of it back up -- Chrome's SpeechRecognition doesn't get real echo
        // cancellation the way a phone call does. If what the mic just heard is
        // actually (most of) what H herself just said, treat it as her own echo,
        // not something the visitor said, so she doesn't reply to herself in a loop.
        function isEchoOfLastReply(heard) {
            if (!lastSpokenReply || !heard) return false;
            const norm = s => s.toLowerCase().replace(/[^\w\s]/g, '').trim();
            const heardNorm = norm(heard);
            const replyNorm = norm(lastSpokenReply);
            if (!heardNorm) return false;
            if (replyNorm.includes(heardNorm)) return true;
            const heardWords = new Set(heardNorm.split(/\s+/));
            const replyWords = new Set(replyNorm.split(/\s+/));
            let overlap = 0;
            heardWords.forEach(w => { if (replyWords.has(w)) overlap++; });
            return overlap / heardWords.size > 0.7;
        }

        function setVoiceStatus(text) { voiceStatus.textContent = text; }

        /* ---- Floating control bar: mute / mic / end ---- */
        const voiceControlBar = document.getElementById('voiceControlBar');
        const voiceMuteBtn = document.getElementById('voiceMuteBtn');
        const voiceMicBtn = document.getElementById('voiceMicBtn');
        const voiceEndBtn = document.getElementById('voiceEndBtn');
        const voiceDragHandle = document.getElementById('voiceDragHandle');
        const orbWrapEl = document.querySelector('.orb-wrap');

        // Single source of truth for what the orb + mic button look like --
        // 'idle'/'muted' dim the orb (H isn't hearing anything right now),
        // 'listening'/'thinking'/'speaking' light it back up.
        function setOrbState(state) {
            orbWrapEl.classList.remove('state-idle', 'state-listening', 'state-thinking', 'state-speaking', 'state-muted');
            orbWrapEl.classList.add('state-' + state);
            voiceMicBtn.classList.toggle('is-listening', state === 'listening');
            voiceMicBtn.classList.toggle('is-speaking', state === 'speaking');
            voiceMicBtn.classList.toggle('is-muted-state', state === 'muted');
        }

        function updateMuteUI() {
            voiceMuteBtn.classList.toggle('is-muted', voiceMuted);
            voiceMuteBtn.querySelector('.icon-mic').style.display = voiceMuted ? 'none' : 'block';
            voiceMuteBtn.querySelector('.icon-mic-off').style.display = voiceMuted ? 'block' : 'none';
        }

        voiceMuteBtn.addEventListener('click', () => {
            voiceMuted = !voiceMuted;
            updateMuteUI();
            if (voiceMuted) {
                stopAnyRecognition();
                if (!isHSpeaking) { setVoiceStatus('Muted — tap mic to talk'); setOrbState('muted'); }
            } else if (!isHSpeaking && voiceConversationActive) {
                startVoiceListenCycle(); // unmuting resumes the continuous conversation
            }
        });

        // Tap-to-talk / barge-in: while H is speaking, tapping the mic interrupts
        // her and starts listening immediately -- the same "cut her off" gesture
        // ChatGPT's voice mode supports, instead of having to wait her out.
        voiceMicBtn.addEventListener('click', () => {
            if (!voiceConversationActive) return;
            if (isHSpeaking) {
                stopSpeaking();
                isHSpeaking = false;
                voiceTurnToken++; // invalidate the in-flight speak callback so it can't restart the cycle itself
                if (voiceMuted) { voiceMuted = false; updateMuteUI(); }
                startVoiceListenCycle();
                return;
            }
            if (voiceRecognition) {
                // Already listening -- tap again to cancel this turn and go quiet.
                stopAnyRecognition();
                setVoiceStatus(voiceMuted ? 'Muted — tap mic to talk' : 'Tap mic to talk');
                setOrbState(voiceMuted ? 'muted' : 'idle');
                return;
            }
            if (voiceMuted) { voiceMuted = false; updateMuteUI(); }
            startVoiceListenCycle();
        });

        voiceEndBtn.addEventListener('click', () => switchMode('text'));

        // Drag the whole pill by its handle -- pointer events cover mouse/touch/pen
        // alike. Only the handle starts a drag so button taps stay clickable.
        (function enableControlBarDrag() {
            let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
            voiceDragHandle.addEventListener('pointerdown', (e) => {
                dragging = true;
                voiceControlBar.classList.add('dragging');
                voiceDragHandle.setPointerCapture(e.pointerId);
                const rect = voiceControlBar.getBoundingClientRect();
                startLeft = rect.left; startTop = rect.top;
                startX = e.clientX; startY = e.clientY;
                voiceControlBar.style.left = rect.left + 'px';
                voiceControlBar.style.top = rect.top + 'px';
                voiceControlBar.style.bottom = 'auto';
                voiceControlBar.style.transform = 'none';
            });
            voiceDragHandle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const maxLeft = window.innerWidth - voiceControlBar.offsetWidth - 8;
                const maxTop = window.innerHeight - voiceControlBar.offsetHeight - 8;
                const newLeft = Math.min(Math.max(8, startLeft + (e.clientX - startX)), Math.max(8, maxLeft));
                const newTop = Math.min(Math.max(8, startTop + (e.clientY - startY)), Math.max(8, maxTop));
                voiceControlBar.style.left = newLeft + 'px';
                voiceControlBar.style.top = newTop + 'px';
            });
            function endDrag(e) {
                if (!dragging) return;
                dragging = false;
                voiceControlBar.classList.remove('dragging');
                try { voiceDragHandle.releasePointerCapture(e.pointerId); } catch (err) {}
            }
            voiceDragHandle.addEventListener('pointerup', endDrag);
            voiceDragHandle.addEventListener('pointercancel', endDrag);
        })();

        // Reuses hVoiceAudio (declared above, for the mobile unlock) for every
        // turn instead of creating a new element each time.
        let activeVoiceObjectUrl = null;
        let audioPlaybackToken = 0;
        function stopSpeaking() {
            audioPlaybackToken++;
            hVoiceAudio.onended = null;
            hVoiceAudio.onerror = null;
            hVoiceAudio.pause();
            hVoiceAudio.removeAttribute('src');
            hVoiceAudio.load();
            if (activeVoiceObjectUrl) URL.revokeObjectURL(activeVoiceObjectUrl);
            activeVoiceObjectUrl = null;
        }

        function kokoroAudioBlob(audio) {
            if (!audio || typeof audio.data !== 'string' || !audio.data) return null;
            const binary = atob(audio.data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const claimedType = audio.mimeType || audio.contentType;
            const mimeType = typeof claimedType === 'string' && claimedType.startsWith('audio/')
                ? claimedType
                : 'audio/mpeg';
            return new Blob([bytes], { type: mimeType });
        }

        // Plays H's real Kokoro voice (self-hosted, ChatGPT-quality) instead of
        // the browser's robotic built-in speechSynthesis. onEnd(played) reports
        // whether audio actually played, so callers can fall back to text-only.
        function speak(audio, onEnd) {
            stopSpeaking();
            const playbackToken = audioPlaybackToken;
            let blob;
            try { blob = kokoroAudioBlob(audio); } catch (e) { blob = null; }
            if (!blob) { onEnd(false); return; }

            activeVoiceObjectUrl = URL.createObjectURL(blob);
            let ended = false;
            const finish = (played) => {
                if (ended || playbackToken !== audioPlaybackToken) return;
                ended = true;
                hVoiceAudio.onended = null;
                hVoiceAudio.onerror = null;
                if (activeVoiceObjectUrl) URL.revokeObjectURL(activeVoiceObjectUrl);
                activeVoiceObjectUrl = null;
                onEnd(played);
            };
            hVoiceAudio.onended = () => finish(true);
            hVoiceAudio.onerror = () => finish(false);
            hVoiceAudio.volume = 1;
            hVoiceAudio.src = activeVoiceObjectUrl;
            const playAttempt = hVoiceAudio.play();
            if (playAttempt) playAttempt.catch(() => finish(false));
        }

        function stopAnyRecognition() {
            if (voiceRecognition) {
                try { voiceRecognition.onresult = null; voiceRecognition.onerror = null; voiceRecognition.onend = null; voiceRecognition.abort(); } catch (e) {}
                voiceRecognition = null;
            }
        }

        function startVoiceListenCycle() {
            if (!voiceConversationActive || isHSpeaking || voiceMuted) return;
            stopAnyRecognition(); // never let two recognition instances run at once
            const myToken = ++voiceTurnToken;
            const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognitionCtor) {
                setVoiceStatus('Voice input needs Chrome, Edge, or another Web Speech-capable browser.');
                stopVoiceConversation();
                return;
            }
            const recognition = new SpeechRecognitionCtor();
            recognition.lang = document.documentElement.lang || 'en-US';
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            voiceRecognition = recognition;
            orbSpeedMultiplier = 1.6;
            setOrbState('listening');
            setVoiceStatus('Listening…');
            voiceTranscript.textContent = '';

            let finalTranscript = '';
            recognition.onresult = (e) => {
                if (myToken !== voiceTurnToken) return;
                let interim = '';
                let gotFinal = false;
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) { finalTranscript += e.results[i][0].transcript; gotFinal = true; }
                    else interim += e.results[i][0].transcript;
                }
                voiceTranscript.textContent = finalTranscript + interim;
                // One utterance per turn -- without this, a short pause followed by
                // more speech (e.g. "hi" ... "how are you") can land as two final
                // segments inside the SAME cycle, or keep the mic open long enough
                // to catch a next turn's words before this one's even been handled.
                // Stopping right away as soon as we have a final segment forces a
                // clean one-utterance-in, one-reply-out turn every time.
                if (gotFinal) { try { recognition.stop(); } catch (err) {} }
            };
            recognition.onerror = () => { if (myToken === voiceTurnToken) voiceRecognition = null; };
            recognition.onend = () => {
                if (myToken !== voiceTurnToken) return; // superseded by a newer cycle -- ignore
                voiceRecognition = null;
                orbSpeedMultiplier = 1;
                if (!voiceConversationActive) return;
                const text = finalTranscript.trim();
                // Confidence-based filtering used to also drop short real words
                // like "hello" (the recognizer often scores common short words
                // only moderately confident) -- only guard against true silence
                // and H hearing her own echo now, not against brevity.
                const isLikelyNoise = !text || isEchoOfLastReply(text);
                if (!isLikelyNoise) handleVoiceTurn(text, myToken);
                else startVoiceListenCycle(); // silence or H's own echo -- keep listening
            };
            try { recognition.start(); } catch (e) { voiceRecognition = null; }
        }

        // Light, dependency-free topic guess from what the visitor just said --
        // good enough to make a filler joke feel "about" the question without
        // spending an extra LLM call (which would only add to the very wait
        // we're covering for).
        const FILLER_STOPWORDS = new Set(['the','a','an','is','are','was','were','what','how','why','who','whats',
            'when','where','can','you','tell','me','about','please','know','do','does','did','to','of','and','or',
            'for','with','on','in','at','it','that','this','i','my','your','ive','im','will','would','could','should',
            'give','some','any','just','like','okay','ok','hey','hi','hello','there']);
        function guessTopicFromText(text) {
            const words = (text || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/)
                .filter(w => w && w.length > 2 && !FILLER_STOPWORDS.has(w));
            if (!words.length) return null;
            return words.sort((a, b) => b.length - a.length)[0];
        }
        // Kept short on purpose -- "complete it faster" per feedback: a joke that's
        // still going when the real reply arrives never gets cut off mid-sentence
        // (see hFillerAudioPlaying below), so a long joke would just delay H's
        // actual answer instead of covering for it.
        const FILLER_JOKE_TEMPLATES = [
            'Quick one about {topic} -- why did {topic} bring a ladder? Things were looking up.',
            'Since we\'re on {topic}: what did one {topic} say to the other? Let\'s stick together.',
            'Funny you mention {topic} -- I hear {topic} make great listeners, they never interrupt.',
            'One about {topic}: why so serious? Even {topic} takes a joke sometimes.',
        ];
        function buildFillerJokeText(topic) {
            const template = FILLER_JOKE_TEMPLATES[Math.floor(Math.random() * FILLER_JOKE_TEMPLATES.length)];
            return template.replace(/\{topic\}/g, topic);
        }

        // Whatever filler/joke line is playing right now is always allowed to
        // finish -- per feedback, cutting a joke off mid-sentence to jump to the
        // real answer feels broken. Instead, if the real reply lands while
        // something is still playing, it's stashed here and delivered the moment
        // that line's audio naturally ends.
        let hFillerAudioPlaying = false;
        let hPendingReply = null;
        let hReplyPending = false;
        let hFillerRound = 0;

        function deliverHReply(myToken, reply, audio) {
            if (myToken !== voiceTurnToken || !voiceConversationActive) return;
            recordTranscript('user', hLastUserText);
            recordTranscript('assistant', reply);

            const match = reply.match(LEARN_PATTERN);
            voiceTranscript.textContent = reply;
            setVoiceStatus('H is speaking…');
            setOrbState('speaking');
            isHSpeaking = true;
            lastSpokenReply = reply;
            orbSpeedMultiplier = 2;
            speak(audio, (played) => {
                isHSpeaking = false;
                orbSpeedMultiplier = 1;
                if (myToken !== voiceTurnToken || !voiceConversationActive) return;
                if (!played) setVoiceStatus('Voice audio is unavailable — continuing in text.');
                if (match) {
                    setVoiceStatus('Switch to Text mode to teach H that word, or just keep talking.');
                }
                voiceTranscript.textContent = '';
                if (voiceMuted) {
                    setVoiceStatus('Muted — tap mic to talk');
                    setOrbState('muted');
                    return;
                }
                setOrbState('idle');
                // Small buffer before re-arming the mic when real audio played --
                // playback's onended can fire slightly before sound actually
                // finishes through the speakers, so listening immediately risks
                // the mic picking up H's own trailing voice and "replying" to
                // herself. No audio played means nothing to echo, so no delay.
                if (played) {
                    setTimeout(() => {
                        if (myToken === voiceTurnToken && voiceConversationActive && !voiceMuted) startVoiceListenCycle();
                    }, 700);
                } else if (voiceConversationActive && !voiceMuted) {
                    startVoiceListenCycle();
                }
            });
        }

        function playHThinkingFiller(myToken, userText) {
            if (myToken !== voiceTurnToken || !voiceConversationActive || !hReplyPending) return;
            hFillerRound++;
            const proceedWithAudio = (audio) => {
                if (myToken !== voiceTurnToken || !voiceConversationActive || !hReplyPending) return;
                isHSpeaking = true;
                hFillerAudioPlaying = true;
                orbSpeedMultiplier = 2;
                setOrbState('speaking');
                speak(audio, () => {
                    hFillerAudioPlaying = false;
                    if (myToken !== voiceTurnToken || !voiceConversationActive) return;
                    isHSpeaking = false;
                    orbSpeedMultiplier = 1;
                    // The real reply arrived while this line was playing -- since
                    // we never cut it off, deliver the answer now that it's done.
                    if (hPendingReply) {
                        const { reply, audio: replyAudio } = hPendingReply;
                        hPendingReply = null;
                        deliverHReply(myToken, reply, replyAudio);
                        return;
                    }
                    if (!hReplyPending) return;
                    setOrbState('thinking');
                    // Ollama can legitimately take a while on CPU -- if it's still
                    // not back, say something else after a real pause, rather than
                    // going quiet again for the rest of a long wait.
                    setTimeout(() => playHThinkingFiller(myToken, userText), 3000);
                });
            };
            // Round 1 needs to be instant (it's covering the very first beat of
            // silence) -- generic pre-loaded pool. Round 2 spends one /api/tts
            // round trip on a topical joke, now that the wait already justifies
            // it. Round 3+ shifts to "almost there" reassurance rather than
            // telling joke after joke.
            if (hFillerRound === 2) {
                const topic = guessTopicFromText(userText);
                if (topic) {
                    fetch('/api/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: buildFillerJokeText(topic) }),
                    }).then(r => r.json()).then(d => {
                        if (myToken !== voiceTurnToken || !voiceConversationActive || !hReplyPending) return;
                        proceedWithAudio(d.audio || pickHFillerAudio());
                    }).catch(() => proceedWithAudio(pickHFillerAudio()));
                    return;
                }
            }
            const audio = hFillerRound >= 3
                ? (pickHAlmostThereAudio() || pickHFillerAudio())
                : pickHFillerAudio();
            if (!audio) return; // not loaded yet -- just stay quiet, no big deal
            proceedWithAudio(audio);
        }

        let hTurnInFlight = false;
        let hLastUserText = '';
        async function handleVoiceTurn(text, myToken) {
            if (hTurnInFlight) return; // defensive -- a turn is already being handled, never overlap two
            hTurnInFlight = true;
            hLastUserText = text;
            lastSpokenReply = ''; // a real new turn is starting -- stop guarding against the old echo
            setOrbState('thinking');
            setVoiceStatus('H is thinking…');
            // The LLM + TTS round trip is slow enough to read as broken silence --
            // if the real reply isn't back within a beat, speak a quick filler
            // instead of leaving dead air, same idea as ChatGPT voice's "let me think".
            hReplyPending = true;
            hFillerRound = 0;
            hPendingReply = null;
            const fillerTimer = setTimeout(() => playHThinkingFiller(myToken, text), 1200);
            try {
                const { reply, audio } = await askH(text, { voice: true });
                hReplyPending = false;
                hTurnInFlight = false;
                clearTimeout(fillerTimer);
                if (myToken !== voiceTurnToken || !voiceConversationActive) return; // a newer turn superseded this one
                // A filler/joke is still mid-sentence -- let it finish naturally
                // instead of cutting it off; its own onEnd will deliver this.
                if (hFillerAudioPlaying) { hPendingReply = { reply, audio }; return; }
                deliverHReply(myToken, reply, audio);
            } catch (err) {
                hReplyPending = false;
                hTurnInFlight = false;
                clearTimeout(fillerTimer);
                if (myToken !== voiceTurnToken || !voiceConversationActive) return;
                setOrbState('idle');
                setVoiceStatus("Couldn't reach H -- trying again shortly.");
                setTimeout(() => { if (voiceConversationActive && !voiceMuted) startVoiceListenCycle(); }, 2000);
            }
        }

        function startVoiceConversation() {
            voiceConversationActive = true;
            startVoiceListenCycle(); // continuous conversation -- she's listening the moment you open voice mode
        }
        function stopVoiceConversation() {
            voiceConversationActive = false;
            isHSpeaking = false;
            voiceMuted = false;
            orbSpeedMultiplier = 1;
            voiceTurnToken++; // invalidate any in-flight cycle/turn
            stopAnyRecognition();
            stopSpeaking();
            setOrbState('idle');
            updateMuteUI();
            setVoiceStatus('Starting…');
            voiceTranscript.textContent = '';
        }

        /* ============ HISTORY / TRANSCRIPT PANEL ============ */
        const historyPanel = document.getElementById('historyPanel');
        const historyToggleBtn = document.getElementById('historyToggleBtn');
        const historyList = document.getElementById('historyList');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const downloadHistoryBtn = document.getElementById('downloadHistoryBtn');

        function renderHistoryPanel() {
            if (!hHistory.length) {
                historyList.innerHTML = '<div id="historyEmpty">No messages yet.</div>';
                return;
            }
            historyList.innerHTML = '';
            hHistory.forEach(m => appendMsg(historyList, m.role === 'user' ? 'user' : 'assistant', m.content));
        }
        historyToggleBtn.addEventListener('click', () => {
            const willOpen = !historyPanel.classList.contains('open');
            historyPanel.classList.toggle('open', willOpen);
            historyToggleBtn.classList.toggle('active', willOpen);
            if (willOpen) renderHistoryPanel();
        });
        closeHistoryBtn.addEventListener('click', () => {
            historyPanel.classList.remove('open');
            historyToggleBtn.classList.remove('active');
        });
        downloadHistoryBtn.addEventListener('click', () => {
            const lines = hHistory.map(m => `${m.role === 'user' ? 'You' : 'H'}: ${m.content}`);
            const blob = new Blob([lines.join('\n\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'h-conversation.txt';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        /* ---- Siri-wave shader as the voice-mode orb (same GLSL as the main app's
           voice button). Speed doubles while listening/speaking. ---- */
        const ORB_VERTEX_SHADER = `attribute vec2 aPos; void main(){ gl_Position=vec4(aPos,0.0,1.0); }`;
        const ORB_FRAGMENT_SHADER = `precision highp float;
uniform vec2 iResolution; uniform float iTime;
const float PI = 3.14159265359;
const float AMPLITUDE   = 0.32;
const float FREQ        = 1.1;
const float ABER_FREQ   = 1.0;
const float SPEED       = 2.4;
const float WAVE_SCALE  = 0.6;
const float ABERRATION  = 2.6;
const float THICKNESS   = 3.0;
const float INTENSITY   = 2.;
const float FALLOFF     = 1.7;
const float EDGE_MASK   = 0.4;
const float EDGE_INSET  = 0.0;
const float BAND_FILL   = 30000.0;
const float BAND_THICK  = 0.08;
const float SOFTNESS    = 2.5;
const float LOW_AMP     = 6.0;
const float LOW_INT     = 1.5;
const float MID_ABER    = 0.8;
const float MID_ABAMP   = 0.05;
const float MID_BAND    = 20.0;
const float MID_SOFT    = 0.4;
const float HIGH_ABER   = 0.5;
const float HIGH_ABAMP  = 0.06;
const float RESOLVED    = 1.0;
const float UNRES_SCALE = 0.14;

vec3 spectral4(int s){
    float x = float(s);
    return clamp(vec3(abs(x-3.0)-1.0, 2.0-abs(x-2.0), 2.0-abs(x-4.0)), 0.0, 1.0);
}

void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 R = iResolution.xy;
    float aspect = R.x / R.y;
    vec2 p = (fragCoord + 0.5) * 2.0 / R - 1.0;
    p.x *= aspect;
    float yScreen = p.y;
    p /= max(WAVE_SCALE, 0.1);

    float t   = iTime;
    float low  = clamp(0.45 + 0.45*sin(t*0.8)*sin(t*0.37+1.0), 0.0, 1.0);
    float mid  = clamp(0.40 + 0.40*sin(t*1.7+2.0)*sin(t*0.53), 0.0, 1.0);
    float high = clamp(0.30 + 0.30*sin(t*2.9+4.0)*sin(t*0.71+2.0), 0.0, 1.0);

    float res   = clamp(RESOLVED, 0.0, 1.0);
    float drift = mod(t, 20.0*PI) * SPEED;

    float xN  = p.x / max(aspect, 1.0);
    float env = cos(PI*0.5 * min(abs(0.9*xN), 1.0));
    env *= env;

    float A1    = AMPLITUDE + 0.01*low*LOW_AMP;
    float A2    = A1 + mid*MID_ABAMP + high*HIGH_ABAMP;
    float AB    = (ABERRATION + mid*MID_ABER + high*HIGH_ABER)*res;
    float th    = mix(0.1, 0.01*THICKNESS, res);
    float inten = mix(0.1, 0.01*(INTENSITY + low*LOW_INT), res);
    float soft  = 0.01*res*max(0.0, SOFTNESS + mid*MID_SOFT);

    float dUnres = max(length(p) - mix(0.14, UNRES_SCALE, res), 0.0);
    float yMain = A1 * env * res * sin(p.x*FREQ + drift);

    float bandFillTh = max(BAND_THICK, 1e-4);
    float bandAmt    = 1e-4 * BAND_FILL * inten;
    vec3 num = vec3(0.0), den = vec3(0.0);
    for(int s = 0; s < 4; s++){
        vec3 hue = mix(vec3(1.0), spectral4(s), res);
        den += hue;
        float ab = mix(-AB, AB, float(s)/3.0);
        float yL = A2 * env * res * sin(p.x*ABER_FREQ + drift + ab);
        float d   = mix(dUnres, abs(p.y - yL), res);
        float lor = mix(1.0/(1.0 + (0.02*d)*(0.02*d)), 1.0, res);
        float line = inten / (sqrt(d*d + soft*soft) + th);
        float lo = min(yMain, yL), hi = max(yMain, yL);
        float dBand = max(0.0, max(p.y - hi, lo - p.y));
        float band  = bandAmt / (dBand + bandFillTh);
        num += hue * lor * (line + band);
    }
    vec3 col = num / den;

    float dM    = mix(dUnres, abs(p.y - yMain), res);
    float lorM  = mix(1.0/(1.0 + (0.02*dM)*(0.02*dM)), 1.0, res);
    float boost = (1.0 - res) * (14.0*low + 4.0);
    col += 0.5 * inten * (lorM + boost) / (sqrt(dM*dM + soft*soft) + th);

    col = pow(max(col, 0.0), vec3(1.5));
    float emT = clamp((abs(yScreen) - 1.0 + EDGE_INSET) / (-max(EDGE_MASK, 1e-4)), 0.0, 1.0);
    float em  = emT*emT*(3.0 - 2.0*emT);
    float gauss = exp(-pow(xN*FALLOFF, 2.0));
    col *= mix(1.0, em*gauss, res);
    col *= res;
    fragColor = vec4(col, 1.0);
}
void main(){
    vec4 c;
    mainImage(c, gl_FragCoord.xy);
    float alpha = clamp(max(max(c.r, c.g), c.b), 0.0, 1.0);
    gl_FragColor = vec4(c.rgb, alpha);
}`;

        let orbInitialized = false;
        function initVoiceOrb() {
            if (orbInitialized) return;
            orbInitialized = true;
            const canvas = document.getElementById('voiceCanvas');
            const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false });
            if (!gl) return;
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            function compile(type, src) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, src);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('orb shader compile error:', gl.getShaderInfoLog(shader));
                    return null;
                }
                return shader;
            }
            const vs = compile(gl.VERTEX_SHADER, ORB_VERTEX_SHADER);
            const fs = compile(gl.FRAGMENT_SHADER, ORB_FRAGMENT_SHADER);
            if (!vs || !fs) return;
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            gl.useProgram(program);

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            const aPos = gl.getAttribLocation(program, 'aPos');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            const uResolution = gl.getUniformLocation(program, 'iResolution');
            const uTime = gl.getUniformLocation(program, 'iTime');
            const dim = canvas.width;
            gl.viewport(0, 0, dim, dim);

            let lastFrameAt = performance.now();
            let shaderTime = 0;
            function frame() {
                const now = performance.now();
                const dt = (now - lastFrameAt) / 1000;
                lastFrameAt = now;
                shaderTime += dt * orbSpeedMultiplier;
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform2f(uResolution, dim, dim);
                gl.uniform1f(uTime, shaderTime);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                requestAnimationFrame(frame);
            }
            frame();
        }
    </script>
