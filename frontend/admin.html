<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
    :root {
        /* Same black system as the rest of the product (index.html/landing.html/
           h.html) -- no light mode, matching the site-wide black-only decision. */
        --bg-main: #09090b;
        --bg-card: #0d0d10;
        --bg-sidebar: #0d0d10;
        --border: #1f1f23;
        --text-normal: #fafafa;
        --text-muted: #a1a1aa;
        --accent: #9B8AFB;
        --accent-hover: #8171E8;
        --accent-dim: rgba(155, 138, 251, 0.14);
        --accent-red: #e66767;
        --accent-green: #199e70;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
        /* GLASS TOKENS -- same "Liquid Glass" material as frontend/index.html
           (see the --glass-* tokens there), so admin panels read as the same
           product rather than a flatter, unrelated back office. Admin stays
           black-only by design (no light mode -- see body/.topbar below), so
           there is a single dark glass recipe rather than light/dark pairs. */
        --glass-blur: blur(24px) saturate(180%);
        --glass-weak: rgba(255, 255, 255, 0.05);
        --glass-strong: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.12);
        /* Near-opaque fallback for surfaces nested INSIDE another blurred
           surface (e.g. a select sitting on a blurred modal-card): a nested
           backdrop-filter can only sample its blurred ancestor's own
           composited output, not real content behind it, so stacking glass on
           glass just muddies both layers instead of reading as more depth. */
        --menu-surface: rgba(13, 13, 16, 0.97);
        /* Chart-specific tokens (dataviz skill) -- gridlines/axis recessive against
           the card surface, distinct from --border which is used for UI chrome. */
        --chart-grid: #1a1a1e;
        --chart-axis: #2c2c31;
        /* Validated categorical palette (dark column), CVD- and contrast-checked
           against this exact surface (#09090b) via the dataviz skill's validator. */
        --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
        --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--bg-main); color: var(--text-normal);
        font-family: 'Inter', system-ui, -apple-system, sans-serif, 'Noto Color Emoji';
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    button, input, select { font-family: inherit; }

    /* TOP BAR */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 20px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
        background: var(--glass-weak);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-left h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .topbar-badge { font-size: 11px; background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .btn {
        border: 1px solid var(--glass-border); background: var(--menu-surface); color: var(--text-normal);
        padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: var(--accent-dim); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: var(--accent-red); }
    .btn.small { padding: 4px 9px; font-size: 12px; }

    /* LAYOUT */
    .app-body { display: flex; flex: 1; min-height: 0; }
    .sidebar {
        width: 220px; flex-shrink: 0; border-right: 1px solid var(--glass-border);
        padding: 14px 10px; overflow-y: auto;
        background: var(--glass-weak);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
    }
    .sidebar-heading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 4px 8px 8px; }
    .dash-row {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; margin-bottom: 2px;
    }
    .dash-row:hover { background: var(--accent-dim); }
    .dash-row.active { background: var(--accent-dim); color: var(--accent); font-weight: 700; }
    .dash-row-actions { display: none; gap: 4px; }
    .dash-row:hover .dash-row-actions { display: flex; }
    .dash-row-actions button { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 12px; padding: 2px; }
    .dash-row-actions button:hover { color: var(--accent-red); }

    .main { flex: 1; overflow-y: auto; padding: 20px 24px 60px; }

    /* OVERVIEW CARDS */
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .overview-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 16px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .overview-card .value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .overview-card .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* INSIGHTS -- Growth / Feature Usage / Retention */
    .insights-section { margin-bottom: 28px; display: flex; flex-direction: column; gap: 18px; }
    .insights-row-split { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 900px) { .insights-row-split { grid-template-columns: 1fr; } }
    .insights-card-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .insights-card-header h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .insights-subtitle { font-size: 11.5px; color: var(--text-muted); }

    .stat-tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .stat-tile-grid-compact { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 10px; }
    .stat-tile {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px;
        padding: 12px 14px; box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .stat-tile .stat-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-tile .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .stat-tile.accent .stat-value { color: var(--accent); }
    .stat-tile.status-good .stat-value { color: #59d68c; }
    .stat-tile.status-critical .stat-value { color: var(--accent-red); }

    .chart-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 16px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .chart-canvas-wrap { position: relative; height: 200px; }
    .chart-canvas-wrap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--glass-border); }
    .chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); }
    .chart-legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
    /* Solid, not glass -- floats over an already-blurred .chart-card, see the
       nested-backdrop-filter note on :root. */
    .chart-tooltip {
        position: absolute; pointer-events: none; background: var(--menu-surface); border: 1px solid var(--glass-border);
        border-radius: 8px; padding: 6px 10px; font-size: 11.5px; box-shadow: var(--shadow); white-space: nowrap;
        transform: translate(-50%, -110%); opacity: 0; transition: opacity 0.1s ease; z-index: 5;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-label { color: var(--text-muted); }
    .chart-tooltip .tt-value { font-weight: 700; font-variant-numeric: tabular-nums; }

    .retention-table-wrap {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 12px; padding: 6px 14px; overflow-x: auto;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .retention-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .retention-table th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 8px; border-bottom: 1px solid var(--glass-border); }
    .retention-table td { padding: 8px; border-bottom: 1px solid var(--glass-border); font-variant-numeric: tabular-nums; }
    .retention-table tr:last-child td { border-bottom: none; }
    .retention-cell { display: flex; align-items: center; gap: 6px; }
    .retention-bar-track { width: 46px; height: 5px; border-radius: 3px; background: var(--glass-border); overflow: hidden; flex-shrink: 0; }
    .retention-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
    .retention-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* DASHBOARD HEADER */
    .dashboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .dashboard-header h2 { font-size: 18px; margin: 0; }
    .dashboard-header-actions { display: flex; gap: 8px; }

    /* WIDGET GRID */
    .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .widget-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 16px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; min-height: 190px;
    }
    .widget-card.dragging { opacity: 0.4; }
    .widget-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 6px; cursor: grab; }
    .widget-card-title { font-size: 13.5px; font-weight: 700; }
    .widget-card-sub { font-size: 11px; color: var(--text-muted); }
    .widget-card-actions { display: flex; gap: 2px; }
    .widget-card-actions button { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 13px; padding: 3px 5px; border-radius: 5px; }
    .widget-card-actions button:hover { background: var(--accent-dim); color: var(--accent); }
    .widget-canvas-wrap { flex: 1; min-height: 120px; position: relative; }
    .widget-canvas-wrap canvas { width: 100%; height: 100%; display: block; }
    .widget-number-value { font-size: 34px; font-weight: 800; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .widget-number-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .add-widget-card {
        display: flex; align-items: center; justify-content: center; min-height: 190px;
        border: 1.5px dashed var(--glass-border); border-radius: 12px; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 600;
        background: var(--glass-weak);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .add-widget-card:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    /* MODALS -- dim overlay + floating glass card, same two-layer pairing as
       every .modal-overlay > .delete-choice-card in index.html: the overlay's
       own blur softens the app shell behind it, and the card's blur is a
       second, independent glass surface floating on top of that dim, not a
       readback of it. */
    .modal-overlay {
        display: none; position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 100;
        background: rgba(10, 14, 18, 0.45);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 14px; padding: 20px;
        width: 380px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: 0 10px 40px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .modal-card h3 { margin: 0 0 14px; font-size: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    /* Solid, not glass -- these sit on top of .modal-card, which is already
       blurred, so a nested backdrop-filter here would only sample the card's
       own composited surface rather than the app behind it (see --menu-surface
       comment on :root). A flat near-opaque fill reads as the recessed input
       well against the lighter glass card instead. */
    .form-group input, .form-group select {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--glass-border);
        background: var(--menu-surface); color: var(--text-normal); font-size: 13.5px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .reports-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .report-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--glass-border); border-radius: 8px; font-size: 12.5px; }
    .report-row-email { font-weight: 600; }
    .report-row-meta { color: var(--text-muted); font-size: 11px; }
    .note-banner { font-size: 12px; color: var(--text-muted); background: var(--accent-dim); padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; }

    /* ACCESS DENIED / LOADING */
    .gate-screen { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
    .gate-screen h2 { margin: 0; }
    .gate-screen p { color: var(--text-muted); max-width: 360px; margin: 0; }

    /* THEMED CONFIRM / PROMPT / TOAST — replaces native alert/confirm/prompt.
       Both sit directly on the (unblurred) page/overlay, so they get the full
       glass treatment same as .modal-card. */
    .hai-dialog-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 14px; padding: 20px 24px;
        width: 320px; max-width: 92vw;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: 0 10px 40px rgba(0,0,0,0.28), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .hai-dialog-card p { margin: 0 0 16px; font-size: 13px; color: var(--text-normal); white-space: pre-line; text-align: center; line-height: 1.5; }
    .hai-dialog-btns { display: flex; gap: 8px; justify-content: center; }
    .hai-toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .hai-toast {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px 16px; font-size: 13px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.06);
        pointer-events: all; cursor: pointer; white-space: nowrap; max-width: 340px;
    }
    .hai-toast.error { border-color: var(--accent-red); color: var(--accent-red); }

    /* THEME EDITOR */
    .sidebar-sep { height: 1px; background: var(--glass-border); margin: 10px 6px; }
    .theme-mode-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
    .theme-mode-tab { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--menu-surface); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; }
    .theme-mode-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .color-token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .color-token-row {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px 14px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .color-token-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .color-token-inputs { display: flex; align-items: center; gap: 8px; }
    .color-token-inputs input[type="color"] { width: 38px; height: 38px; padding: 2px; border: 1px solid var(--glass-border); border-radius: 8px; cursor: pointer; background: var(--menu-surface); flex-shrink: 0; }
    .color-token-inputs input[type="text"] { flex: 1; padding: 7px 9px; border: 1px solid var(--glass-border); border-radius: 7px; background: var(--menu-surface); color: var(--text-normal); font-size: 13px; font-family: monospace; }
    .theme-preview-card {
        background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; margin-bottom: 20px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }
    .theme-preview-header { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 8px 12px; border-bottom: 1px solid var(--glass-border); text-transform: uppercase; letter-spacing: 0.04em; }
    .theme-preview-mock { display: flex; height: 96px; }
    .theme-preview-sidebar { width: 64px; flex-shrink: 0; padding: 10px 8px; display: flex; flex-direction: column; gap: 5px; }
    .theme-preview-swatch { height: 7px; border-radius: 4px; background: rgba(128,128,128,0.3); }
    .theme-preview-swatch.wide { width: 80%; }
    .theme-preview-swatch.narrow { width: 55%; }
    .theme-preview-chat { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 5px; }
    .theme-preview-bubble-in { align-self: flex-start; padding: 5px 9px; border-radius: 8px 8px 8px 2px; font-size: 9px; background: rgba(128,128,128,0.15); max-width: 60%; }
    .theme-preview-bubble-out { align-self: flex-end; padding: 5px 9px; border-radius: 8px 8px 2px 8px; font-size: 9px; color: #fff; max-width: 60%; }
</style>
</head>
<body>

<div id="gateScreen" class="gate-screen" style="display:none;">
    <h2 id="gateTitle">Checking access…</h2>
    <p id="gateMessage"></p>
    <a class="btn primary" href="/index.html" style="text-decoration:none; margin-top:8px;">Back to Chat</a>
</div>

<div id="appShell" style="display:none; flex-direction: column; height: 100%;">
    <div class="topbar">
        <div class="topbar-left">
            <h1>HAI Admin</h1>
            <span class="topbar-badge">Admin Mode</span>
        </div>
        <div class="topbar-right">
            <span id="topbarUsername" style="font-size:13px; color: var(--text-muted);"></span>
            <a class="btn" href="/index.html" style="text-decoration:none;">💬 Chat Mode</a>
        </div>
    </div>

    <div class="app-body">
        <div class="sidebar">
            <div class="sidebar-heading">Dashboards</div>
            <div id="dashboardList"></div>
            <button type="button" class="btn small" style="width:100%; margin-top:8px;" onclick="createDashboard()">+ New Dashboard</button>
            <div class="sidebar-sep"></div>
            <div class="sidebar-heading">Settings</div>
            <div class="dash-row" id="themeNavRow" onclick="switchToTheme()">
                <span>🎨 Theme Colors</span>
            </div>
        </div>

        <div class="main">
            <div class="overview-grid" id="overviewGrid"></div>

            <!-- GROWTH & FEATURE USAGE -- curated insights, always visible above the
                 user-built dashboards below, powered by /api/admin/growth,
                 /api/admin/feature-usage, /api/admin/retention. -->
            <div class="insights-section">
                <div class="insights-row">
                    <div class="insights-col">
                        <div class="insights-card-header">
                            <h3>Growth &amp; Engagement</h3>
                            <span class="insights-subtitle" id="growthDefinition"></span>
                        </div>
                        <div class="stat-tile-grid" id="growthTiles"></div>
                    </div>
                </div>

                <div class="insights-row insights-row-split">
                    <div class="insights-col">
                        <div class="insights-card-header"><h3>Feature Usage <span class="insights-subtitle">last 30 days</span></h3></div>
                        <div class="chart-card">
                            <div class="chart-canvas-wrap" id="featureUsageChartWrap"><canvas id="featureUsageCanvas"></canvas></div>
                            <div class="chart-legend" id="featureUsageLegend"></div>
                        </div>
                        <div class="stat-tile-grid stat-tile-grid-compact" id="deliveryTiles"></div>
                    </div>
                    <div class="insights-col">
                        <div class="insights-card-header"><h3>Retention <span class="insights-subtitle">by signup cohort</span></h3></div>
                        <div class="retention-table-wrap">
                            <table class="retention-table" id="retentionTable"></table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-header">
                <h2 id="activeDashboardName">Dashboard</h2>
                <div class="dashboard-header-actions">
                    <button type="button" class="btn small" onclick="openReportsModal()">📧 Scheduled Reports</button>
                    <button type="button" class="btn small primary" onclick="openWidgetModal()">+ Add Widget</button>
                </div>
            </div>

            <div id="widgetGrid" class="widget-grid"></div>

            <!-- THEME EDITOR PANEL (replaces widget grid when active) -->
            <div id="themePanel" style="display:none;">
                <div class="dashboard-header">
                    <h2>Brand Colors</h2>
                    <div class="dashboard-header-actions">

<script>
    const token = localStorage.getItem('hai_session_token');
    let dashboards = [];
    let activeDashboardId = null;
    let editingWidgetId = null; // null = adding a new widget
    let metricsCatalog = [];

    async function authFetchJSON(url, method, body) {
        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: body ? JSON.stringify(body) : undefined
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
        return data;
    }

    function showGate(title, message) {
        document.getElementById('gateTitle').innerText = title;
        document.getElementById('gateMessage').innerText = message;
        document.getElementById('gateScreen').style.display = 'flex';
        document.getElementById('appShell').style.display = 'none';
    }

    async function init() {
        if (!token) return showGate('Not logged in', 'Log into HAI first, then open Admin Dashboard from the menu.');
        showGate('Checking access…', '');
        document.getElementById('gateScreen').style.display = 'flex';

        let me;
        try {
            me = await authFetchJSON('/api/auth/me', 'GET');
        } catch (err) {
            return showGate('Session expired', 'Please log back into HAI, then open Admin Dashboard again.');
        }
        if (!me.isAdmin) {
            return showGate('Access denied', 'Your account does not have admin access to this dashboard.');
        }

        document.getElementById('gateScreen').style.display = 'none';
        document.getElementById('appShell').style.display = 'flex';
        document.getElementById('topbarUsername').innerText = '@' + me.username;

        const metricsData = await authFetchJSON('/api/admin/metrics', 'GET');
        metricsCatalog = metricsData.metrics;
        const select = document.getElementById('widgetMetricSelect');
        select.innerHTML = metricsCatalog.map(m => `<option value="${m.key}">${m.label}</option>`).join('');

        await loadOverview();
        setInterval(loadOverview, 30000);

        loadGrowth();
        loadFeatureUsage();
        loadRetention();

        await loadDashboards();
    }

    async function loadOverview() {
        try {
            const o = await authFetchJSON('/api/admin/overview', 'GET');
            const cards = [
                { label: 'Online Now', value: o.onlineNow },
                { label: 'Total Users', value: o.totalUsers },
                { label: 'Total Groups', value: o.totalGroups },
                { label: 'Messages Today', value: o.messagesToday },
                { label: 'Signups Today', value: o.signupsToday },
                { label: 'Messages (7d)', value: o.messages7d },
                { label: 'Signups (7d)', value: o.signups7d }
            ];
            document.getElementById('overviewGrid').innerHTML = cards.map(c =>
                `<div class="overview-card"><div class="value">${c.value.toLocaleString()}</div><div class="label">${c.label}</div></div>`
            ).join('');
        } catch (err) { console.error('overview load failed:', err.message); }
    }

    /* GROWTH & ENGAGEMENT */
    async function loadGrowth() {
        try {
            const g = await authFetchJSON('/api/admin/growth', 'GET');
            document.getElementById('growthDefinition').textContent = 'Active = ' + g.activeDefinition.toLowerCase();
            const tiles = [
                { label: 'DAU', value: g.dau, cls: 'accent' },
                { label: 'WAU', value: g.wau, cls: 'accent' },
                { label: 'MAU', value: g.mau, cls: 'accent' },
                { label: 'Signups Today', value: g.signupsToday },
                { label: 'Signups (7d)', value: g.signups7d },
                { label: 'Signups (30d)', value: g.signups30d },
            ];
            document.getElementById('growthTiles').innerHTML = tiles.map(t => `
                <div class="stat-tile ${t.cls || ''}">
                    <div class="stat-value">${t.value.toLocaleString()}</div>
                    <div class="stat-label">${t.label}</div>
                </div>`).join('');
        } catch (err) {
            console.error('growth load failed:', err.message);
        }
    }

    /* FEATURE USAGE -- categorical bar chart (validated palette) + delivery health tiles */
    let featureUsageData = null;
    async function loadFeatureUsage() {
        try {
            const f = await authFetchJSON('/api/admin/feature-usage?days=30', 'GET');
            featureUsageData = f;
            renderFeatureUsageChart();

            const blockRatePct = (f.messageDelivery.blockRate * 100).toFixed(1);
            const tiles = [
                { label: 'Messages Sent', value: f.messageDelivery.sent, cls: 'status-good' },
                { label: 'Messages Blocked', value: f.messageDelivery.blocked, cls: f.messageDelivery.blocked > 0 ? 'status-critical' : '' },
                { label: 'Block Rate', value: blockRatePct + '%', cls: '' },
            ];
            document.getElementById('deliveryTiles').innerHTML = tiles.map(t => `
                <div class="stat-tile ${t.cls}">
                    <div class="stat-value">${typeof t.value === 'number' ? t.value.toLocaleString() : t.value}</div>
                    <div class="stat-label">${t.label}</div>
                </div>`).join('');
        } catch (err) {
            console.error('feature-usage load failed:', err.message);
        }
    }

    function renderFeatureUsageChart() {
        if (!featureUsageData) return;
        const f = featureUsageData;
        const categories = [
            { label: 'Tic Tac Toe', value: f.gamesStarted.tictactoe, color: 'var(--series-1)' },
            { label: 'Rock Paper Scissors', value: f.gamesStarted.rps, color: 'var(--series-2)' },
            { label: 'Truth or Dare', value: f.gamesStarted.truthdare, color: 'var(--series-3)' },
            { label: 'Nearby Matches', value: f.nearbyMatches, color: 'var(--series-4)' },
            { label: 'Voice Notes', value: f.mediaShared.voiceNotes, color: 'var(--series-5)' },
            { label: 'Photos', value: f.mediaShared.photos, color: 'var(--series-6)' },
            { label: 'Documents', value: f.mediaShared.documents, color: 'var(--series-7)' },
        ];
        const canvas = document.getElementById('featureUsageCanvas');
        drawCategoricalBarChart(canvas, categories);
        document.getElementById('featureUsageLegend').innerHTML = categories.map(c => `
            <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:${c.color}"></span>${c.label} (${c.value.toLocaleString()})</span>
        `).join('');
    }

    /* RETENTION -- cohort table with inline percentage bars */
    async function loadRetention() {
        try {
            const r = await authFetchJSON('/api/admin/retention?days=30', 'GET');
            const table = document.getElementById('retentionTable');
            const cohorts = r.cohorts.filter(c => c.signups > 0).slice(-8).reverse();
            if (!cohorts.length) {
                table.innerHTML = '';
                table.parentElement.innerHTML = '<div class="retention-empty">No signup cohorts with data yet.</div>';
                return;
            }
            const pctCell = (n, total) => {
                const pct = total > 0 ? Math.round((n / total) * 100) : 0;
                return `<td><div class="retention-cell"><div class="retention-bar-track"><div class="retention-bar-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div></td>`;
            };
            table.innerHTML = `
                <thead><tr><th>Cohort</th><th>Signups</th><th>D1</th><th>D7</th><th>D30</th></tr></thead>
                <tbody>
                    ${cohorts.map(c => `
                        <tr>
                            <td>${c.date}</td>
                            <td>${c.signups}</td>
                            ${pctCell(c.d1, c.signups)}
                            ${pctCell(c.d7, c.signups)}
                            ${pctCell(c.d30, c.signups)}
                        </tr>
                    `).join('')}
                </tbody>`;
        } catch (err) {
            console.error('retention load failed:', err.message);
        }
    }

    /* CATEGORICAL BAR CHART -- used by Feature Usage. Rounded data-ends, recessive
       gridlines, hover tooltip (dataviz skill marks + interaction requirements). */
    function drawCategoricalBarChart(canvas, categories) {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        const styles = getComputedStyle(document.documentElement);
        const gridColor = styles.getPropertyValue('--chart-grid').trim();
        const mutedColor = styles.getPropertyValue('--text-muted').trim();

        const values = categories.map(c => c.value);
        const max = Math.max(1, ...values);
        const padding = { top: 10, right: 10, bottom: 8, left: 10 };
        const chartW = w - padding.left - padding.right;
        const chartH = h - padding.top - padding.bottom;

        // Recessive gridlines
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 3; i++) {
            const y = padding.top + chartH * (i / 3);
            ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + chartW, y); ctx.stroke();
        }

        const gap = chartW / categories.length;
        const barWidth = Math.max(6, gap * 0.5);
        const bars = [];
        categories.forEach((c, i) => {
            const barH = Math.max(2, (c.value / max) * chartH);
            const x = padding.left + i * gap + (gap - barWidth) / 2;
            const y = padding.top + chartH - barH;
            // Rounded data-end (top corners only), 4px radius per marks spec.
            const radius = Math.min(4, barWidth / 2, barH);
            ctx.fillStyle = c.color.startsWith('var(') ? styles.getPropertyValue(c.color.slice(4, -1)).trim() : c.color;
            ctx.beginPath();
            ctx.moveTo(x, y + radius);
            ctx.arcTo(x, y, x + radius, y, radius);
            ctx.arcTo(x + barWidth, y, x + barWidth, y + radius, radius);
            ctx.lineTo(x + barWidth, y + barH);
            ctx.lineTo(x, y + barH);
            ctx.closePath();
            ctx.fill();
            bars.push({ x, y, width: barWidth, height: barH, label: c.label, value: c.value });
        });

        attachBarHoverTooltip(canvas, bars, padding, chartH);
    }

    let chartHoverHandlers = new WeakMap();
    function attachBarHoverTooltip(canvas, bars, padding, chartH) {
        // Replace any previously-attached listener for this canvas (re-render on data refresh).
        const prev = chartHoverHandlers.get(canvas);
        if (prev) canvas.removeEventListener('mousemove', prev.move), canvas.removeEventListener('mouseleave', prev.leave);

        let tooltip = canvas.parentElement.querySelector('.chart-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.className = 'chart-tooltip';
            canvas.parentElement.appendChild(tooltip);
        }

        const move = (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const hit = bars.find(b => mx >= b.x && mx <= b.x + b.width && my >= padding.top && my <= padding.top + chartH);
            if (hit) {
                tooltip.innerHTML = `<span class="tt-label">${hit.label}:</span> <span class="tt-value">${hit.value.toLocaleString()}</span>`;
                tooltip.style.left = (hit.x + hit.width / 2) + 'px';
                tooltip.style.top = hit.y + 'px';
                tooltip.classList.add('visible');
            } else {
                tooltip.classList.remove('visible');
            }
        };
        const leave = () => tooltip.classList.remove('visible');
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseleave', leave);
        chartHoverHandlers.set(canvas, { move, leave });
    }

    /* DASHBOARDS */
    async function loadDashboards() {
        const data = await authFetchJSON('/api/admin/dashboards', 'GET');
        dashboards = data.dashboards;

        if (!dashboards.length) {
            // First time in Admin Mode -- seed one starter dashboard so the page
            // isn't empty on first visit.
            const starterLayout = [
                { id: cryptoRandomId(), title: 'Signups', metric: 'signups', chartType: 'bar', rangeDays: 30 },
                { id: cryptoRandomId(), title: 'Messages Sent', metric: 'messages_total', chartType: 'line', rangeDays: 30 },
                { id: cryptoRandomId(), title: 'Active Users (DAU)', metric: 'active_users', chartType: 'line', rangeDays: 30 },
                { id: cryptoRandomId(), title: 'Logins', metric: 'logins', chartType: 'number', rangeDays: 7 }
            ];
            const created = await authFetchJSON('/api/admin/dashboards', 'POST', { name: 'Overview', layout: starterLayout });
            dashboards = [{ id: created.id, name: 'Overview', layout: starterLayout }];
        }

        if (!activeDashboardId || !dashboards.some(d => d.id === activeDashboardId)) {
            activeDashboardId = dashboards[0].id;
        }
        renderDashboardList();
        renderActiveDashboard();
    }

    function cryptoRandomId() {
        return (crypto.randomUUID ? crypto.randomUUID() : 'w-' + Math.random().toString(36).slice(2));
    }

    function currentDashboard() {
        return dashboards.find(d => d.id === activeDashboardId);
    }

    function renderDashboardList() {
        const container = document.getElementById('dashboardList');
        container.innerHTML = dashboards.map(d => `
            <div class="dash-row ${activeView === 'dashboard' && d.id === activeDashboardId ? 'active' : ''}" onclick="selectDashboard('${d.id}')">
                <span>${d.name}</span>
                <span class="dash-row-actions" onclick="event.stopPropagation()">
                    <button type="button" title="Rename" onclick="renameDashboard('${d.id}')">✎</button>
                    <button type="button" title="Delete" onclick="deleteDashboard('${d.id}')">🗑</button>
                </span>
            </div>
        `).join('');
    }

    function selectDashboard(id) {
        activeDashboardId = id;
        if (activeView === 'theme') {
            switchToDashboardView();
        } else {
            renderDashboardList();
            renderActiveDashboard();
        }
    }

    async function createDashboard() {
        const name = await showPrompt('Dashboard name', 'New Dashboard');
        if (!name || !name.trim()) return;
        const created = await authFetchJSON('/api/admin/dashboards', 'POST', { name: name.trim(), layout: [] });
        dashboards.push({ id: created.id, name: name.trim(), layout: [] });
        activeDashboardId = created.id;
        renderDashboardList();
        renderActiveDashboard();
    }

    async function renameDashboard(id) {
        const d = dashboards.find(x => x.id === id);
        const name = await showPrompt('Dashboard name', d.name);
        if (!name || !name.trim() || name.trim() === d.name) return;
        d.name = name.trim();
        await authFetchJSON(`/api/admin/dashboards/${id}`, 'PATCH', { name: d.name });
        renderDashboardList();
        if (id === activeDashboardId) document.getElementById('activeDashboardName').innerText = d.name;
    }

    async function deleteDashboard(id) {
        if (dashboards.length <= 1) { showToast('You need at least one dashboard.'); return; }
        if (!await showConfirm('Delete this dashboard? This cannot be undone.')) return;
        await authFetchJSON(`/api/admin/dashboards/${id}`, 'DELETE');
        dashboards = dashboards.filter(d => d.id !== id);
        if (activeDashboardId === id) activeDashboardId = dashboards[0].id;
        renderDashboardList();
        renderActiveDashboard();
    }

    async function persistActiveDashboardLayout() {
        const d = currentDashboard();
        if (!d) return;
        await authFetchJSON(`/api/admin/dashboards/${d.id}`, 'PATCH', { layout: d.layout });
    }

    /* WIDGET GRID */
    async function renderActiveDashboard() {
        const d = currentDashboard();
        if (!d) return;
        document.getElementById('activeDashboardName').innerText = d.name;

        const grid = document.getElementById('widgetGrid');
        if (!d.layout.length) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No widgets yet. Click "+ Add Widget" to build your first chart.</div>`;
            return;
        }

        grid.innerHTML = d.layout.map(w => `
            <div class="widget-card" draggable="true" data-widget-id="${w.id}">
                <div class="widget-card-header">
                    <div>
                        <div class="widget-card-title">${w.title}</div>
                        <div class="widget-card-sub">${metricLabel(w.metric)} · last ${w.rangeDays}d</div>
                    </div>
                    <div class="widget-card-actions">
                        <button type="button" title="Export CSV" onclick="exportWidgetCsv('${w.id}')">⬇</button>
                        <button type="button" title="Edit" onclick="openWidgetModal('${w.id}')">✎</button>
                        <button type="button" title="Delete" onclick="deleteWidget('${w.id}')">🗑</button>
                    </div>
                </div>
                <div class="widget-body" id="widget-body-${w.id}">
                    <div style="color:var(--text-muted); font-size:12px; padding-top:20px; text-align:center;">Loading…</div>
                </div>
            </div>
        `).join('');

        attachDragHandlers();

        for (const w of d.layout) {
            loadAndRenderWidget(w);
        }
    }

    function metricLabel(key) {
        const m = metricsCatalog.find(x => x.key === key);
        return m ? m.label : key;
    }

    async function loadAndRenderWidget(widget) {
        const bodyEl = document.getElementById(`widget-body-${widget.id}`);
        if (!bodyEl) return;
        try {
            const data = await authFetchJSON(`/api/admin/timeseries?metric=${encodeURIComponent(widget.metric)}&days=${widget.rangeDays}`, 'GET');
            const series = data.series;
            if (widget.chartType === 'number') {
                const total = series.reduce((s, p) => s + p.value, 0);
                bodyEl.innerHTML = `<div class="widget-number-value">${total.toLocaleString()}</div><div class="widget-number-sub">total over last ${widget.rangeDays} days</div>`;
            } else {
                bodyEl.innerHTML = `<div class="widget-canvas-wrap"><canvas></canvas></div>`;
                const canvas = bodyEl.querySelector('canvas');
                requestAnimationFrame(() => drawChart(canvas, series, widget.chartType));
            }
        } catch (err) {
            bodyEl.innerHTML = `<div style="color:var(--accent-red); font-size:12px; padding-top:20px; text-align:center;">Failed to load</div>`;
        }
    }

    /* LIGHTWEIGHT CANVAS CHARTS — no external chart library, consistent with the
       rest of this self-hosted app not depending on any CDN. Marks follow the
       dataviz skill: 2px lines, rounded data-ends, recessive gridlines, and a
       hover layer (crosshair+tooltip on line, per-bar tooltip on bar). */
    function drawChart(canvas, series, type) {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        const styles = getComputedStyle(document.documentElement);
        const accent = styles.getPropertyValue('--accent').trim() || '#9B8AFB';
        const gridColor = styles.getPropertyValue('--chart-grid').trim() || '#1a1a1e';
        const mutedColor = styles.getPropertyValue('--text-muted').trim() || '#a1a1aa';

        const values = series.map(p => p.value);
        const max = Math.max(1, ...values);
        const padding = { top: 6, right: 6, bottom: 18, left: 6 };
        const chartW = w - padding.left - padding.right;
        const chartH = h - padding.top - padding.bottom;

        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 2; i++) {
            const y = padding.top + chartH * (i / 2);
            ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + chartW, y); ctx.stroke();
        }

        const points = []; // hit-test targets for hover, shared shape for line/bar

        if (type === 'bar') {
            const gap = chartW / values.length;
            const barWidth = Math.max(3, gap * 0.6);
            ctx.fillStyle = accent;
            values.forEach((v, i) => {
                const barH = Math.max(1, (v / max) * chartH);
                const x = padding.left + i * gap + (gap - barWidth) / 2;
                const y = padding.top + chartH - barH;
                const radius = Math.min(4, barWidth / 2, barH);
                ctx.beginPath();
                ctx.moveTo(x, y + radius);
                ctx.arcTo(x, y, x + radius, y, radius);
                ctx.arcTo(x + barWidth, y, x + barWidth, y + radius, radius);
                ctx.lineTo(x + barWidth, y + barH);
                ctx.lineTo(x, y + barH);
                ctx.closePath();
                ctx.fill();
                points.push({ x: x + barWidth / 2, y, width: barWidth, top: y, date: series[i].date, value: v });
            });
        } else {
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            values.forEach((v, i) => {
                const x = padding.left + (i / (values.length - 1 || 1)) * chartW;
                const y = padding.top + chartH - (v / max) * chartH;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                points.push({ x, y, date: series[i].date, value: v });
            });
            ctx.stroke();

            ctx.lineTo(padding.left + chartW, padding.top + chartH);
            ctx.lineTo(padding.left, padding.top + chartH);
            ctx.closePath();
            ctx.fillStyle = accent + '22';
            ctx.fill();

            // Rounded data-end on the last point, anchored to the line (marks spec).
            const last = points[points.length - 1];
            ctx.fillStyle = accent;
            ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2); ctx.fill();
        }

        ctx.fillStyle = mutedColor;
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(series[0].date.slice(5), padding.left, h - 4);
        ctx.textAlign = 'right';
        ctx.fillText(series[series.length - 1].date.slice(5), padding.left + chartW, h - 4);

        attachSeriesHoverTooltip(canvas, points, type, padding, chartH, accent);
    }

    /* Hover layer for line (crosshair, snap-to-nearest-x) and bar (direct hit) charts. */
    function attachSeriesHoverTooltip(canvas, points, type, padding, chartH, accent) {
        const prev = chartHoverHandlers.get(canvas);
        if (prev) { canvas.removeEventListener('mousemove', prev.move); canvas.removeEventListener('mouseleave', prev.leave); }

        let tooltip = canvas.parentElement.querySelector('.chart-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.className = 'chart-tooltip';
            canvas.parentElement.style.position = 'relative';
            canvas.parentElement.appendChild(tooltip);
        }
        let crosshair = canvas.parentElement.querySelector('.chart-crosshair');
        if (type === 'line') {
            if (!crosshair) {
                crosshair = document.createElement('div');
                crosshair.className = 'chart-crosshair';
                crosshair.style.cssText = `position:absolute; top:${padding.top}px; height:${chartH}px; width:1px; background:${accent}; opacity:0; pointer-events:none;`;
                canvas.parentElement.appendChild(crosshair);
            }
        } else if (crosshair) {
            crosshair.remove();
        }

        const move = (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            let hit = null;

            if (type === 'bar') {
                hit = points.find(p => mx >= p.x - p.width / 2 && mx <= p.x + p.width / 2 && my >= p.top && my <= padding.top + chartH);
            } else {
                // Nearest point by x, regardless of vertical position -- standard line-chart hover.
                let nearest = points[0], bestDist = Infinity;
                for (const p of points) {
                    const d = Math.abs(p.x - mx);
                    if (d < bestDist) { bestDist = d; nearest = p; }
                }
                hit = nearest;
                if (crosshair) { crosshair.style.left = hit.x + 'px'; crosshair.style.opacity = '1'; }
            }

            if (hit) {
                tooltip.innerHTML = `<span class="tt-label">${hit.date.slice(5)}:</span> <span class="tt-value">${hit.value.toLocaleString()}</span>`;
                tooltip.style.left = hit.x + 'px';
                tooltip.style.top = (hit.y ?? padding.top) + 'px';
                tooltip.classList.add('visible');
            } else {
                tooltip.classList.remove('visible');
                if (crosshair) crosshair.style.opacity = '0';
            }
        };
        const leave = () => { tooltip.classList.remove('visible'); if (crosshair) crosshair.style.opacity = '0'; };
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseleave', leave);
        chartHoverHandlers.set(canvas, { move, leave });
    }

    /* DRAG-REORDER — plain HTML5 drag and drop, no library. */
    let dragSourceId = null;
    function attachDragHandlers() {
        document.querySelectorAll('.widget-card').forEach(card => {
            card.addEventListener('dragstart', (e) => {
                dragSourceId = card.dataset.widgetId;
                card.classList.add('dragging');
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            card.addEventListener('dragover', (e) => e.preventDefault());
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetId = card.dataset.widgetId;
                if (!dragSourceId || dragSourceId === targetId) return;
                const d = currentDashboard();
                const fromIdx = d.layout.findIndex(w => w.id === dragSourceId);
                const toIdx = d.layout.findIndex(w => w.id === targetId);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = d.layout.splice(fromIdx, 1);
                d.layout.splice(toIdx, 0, moved);
                renderActiveDashboard();
                persistActiveDashboardLayout();
            });
        });
    }

    /* ADD/EDIT WIDGET MODAL */
    function openWidgetModal(widgetId) {
        editingWidgetId = widgetId || null;
        const d = currentDashboard();
        const widget = widgetId ? d.layout.find(w => w.id === widgetId) : null;
        document.getElementById('widgetModalHeading').innerText = widget ? 'Edit Widget' : 'Add Widget';
        document.getElementById('widgetTitleInput').value = widget ? widget.title : '';
        document.getElementById('widgetMetricSelect').value = widget ? widget.metric : (metricsCatalog[0] || {}).key || '';
        document.getElementById('widgetChartTypeSelect').value = widget ? widget.chartType : 'line';
        document.getElementById('widgetRangeSelect').value = widget ? String(widget.rangeDays) : '30';
        document.getElementById('widgetModalOverlay').classList.add('open');
    }
    function closeWidgetModal() {
        document.getElementById('widgetModalOverlay').classList.remove('open');
    }
    async function submitWidgetModal() {
        const d = currentDashboard();
        const metric = document.getElementById('widgetMetricSelect').value;
        const title = document.getElementById('widgetTitleInput').value.trim() || metricLabel(metric);
        const chartType = document.getElementById('widgetChartTypeSelect').value;
        const rangeDays = parseInt(document.getElementById('widgetRangeSelect').value, 10);

        if (editingWidgetId) {
            const widget = d.layout.find(w => w.id === editingWidgetId);
            Object.assign(widget, { title, metric, chartType, rangeDays });
        } else {
            d.layout.push({ id: cryptoRandomId(), title, metric, chartType, rangeDays });
        }
        closeWidgetModal();
        renderActiveDashboard();
        await persistActiveDashboardLayout();
    }
    async function deleteWidget(widgetId) {
        if (!await showConfirm('Remove this widget?')) return;
        const d = currentDashboard();
        d.layout = d.layout.filter(w => w.id !== widgetId);
        renderActiveDashboard();
        await persistActiveDashboardLayout();
    }
    async function exportWidgetCsv(widgetId) {
        const d = currentDashboard();
        const widget = d.layout.find(w => w.id === widgetId);
        if (!widget) return;
        try {
            const res = await fetch(`/api/admin/export?metric=${encodeURIComponent(widget.metric)}&days=${widget.rangeDays}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) throw new Error('Export failed');
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${widget.metric}_${widget.rangeDays}d.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (err) {
            showToast('Could not export CSV: ' + err.message, 'error');
        }
    }

    /* SCHEDULED REPORTS */
    async function openReportsModal() {
        document.getElementById('reportsModalOverlay').classList.add('open');
        await renderReportsList();
    }
    function closeReportsModal() {
        document.getElementById('reportsModalOverlay').classList.remove('open');
    }
    async function renderReportsList() {
        const data = await authFetchJSON('/api/admin/reports', 'GET');
        const d = currentDashboard();
        const forThisDashboard = data.reports.filter(r => r.dashboardId === d.id);

        document.getElementById('reportsEmailNote').innerHTML = data.emailEnabled
            ? ''
            : `<div class="note-banner">Email delivery isn't configured on the server yet -- reports will save but won't send until it is.</div>`;

        document.getElementById('reportsList').innerHTML = forThisDashboard.length
            ? forThisDashboard.map(r => `
                <div class="report-row">
                    <div>
                        <div class="report-row-email">${r.email}</div>
                        <div class="report-row-meta">${r.frequency} · ${r.lastSentAt ? 'last sent ' + new Date(r.lastSentAt).toLocaleDateString() : 'not sent yet'}</div>
                    </div>
                    <button type="button" class="btn small danger" onclick="deleteReport('${r.id}')">Remove</button>
                </div>
            `).join('')
            : `<div style="font-size:12px; color:var(--text-muted);">No scheduled reports for this dashboard yet.</div>`;
    }
    async function submitAddReport() {
        const email = document.getElementById('reportEmailInput').value.trim();
        const frequency = document.getElementById('reportFrequencySelect').value;
        if (!email) { showToast('Enter an email address.'); return; }
        const d = currentDashboard();
        try {
            await authFetchJSON('/api/admin/reports', 'POST', { dashboardId: d.id, email, frequency });
            document.getElementById('reportEmailInput').value = '';
            await renderReportsList();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }
    async function deleteReport(id) {
        await authFetchJSON(`/api/admin/reports/${id}`, 'DELETE');
        await renderReportsList();
    }

    /* THEMED TOAST / CONFIRM / PROMPT — replaces native alert/confirm/prompt */
    function showToast(msg, type) {
        const c = document.getElementById('haiToastContainer');
        const t = document.createElement('div');
        t.className = 'hai-toast' + (type ? ' ' + type : '');
        t.textContent = msg;
        c.appendChild(t);
        const remove = () => { t.style.transition = 'opacity 0.3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); };
        const timer = setTimeout(remove, 3500);
        t.addEventListener('click', () => { clearTimeout(timer); remove(); });
    }
    function showConfirm(msg) {
        return new Promise(resolve => {
            document.getElementById('haiConfirmMsg').textContent = msg;
            const ov = document.getElementById('haiConfirmOverlay');
            ov.classList.add('open');
            const done = r => { ov.classList.remove('open'); resolve(r); };
            document.getElementById('haiConfirmOk').onclick    = () => done(true);
            document.getElementById('haiConfirmCancel').onclick = () => done(false);
            ov.onclick = e => { if (e.target === ov) done(false); };
        });
    }
    function showPrompt(msg, defaultValue) {
        return new Promise(resolve => {
            document.getElementById('haiPromptMsg').textContent = msg;
            const inp = document.getElementById('haiPromptInput');
            inp.value = defaultValue || '';
            const ov = document.getElementById('haiPromptOverlay');
            ov.classList.add('open');
            setTimeout(() => inp.focus(), 50);
            const done = r => { ov.classList.remove('open'); resolve(r); };
            document.getElementById('haiPromptOk').onclick     = () => done(inp.value);
            document.getElementById('haiPromptCancel').onclick  = () => done(null);
            ov.onclick = e => { if (e.target === ov) done(null); };
            inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); };
        });
    }

    /* THEME EDITOR */
    const THEME_TOKEN_LABELS = {
        accentBrand:      'Accent Brand',
        accentBrandHover: 'Accent Brand Hover',
        bgMain:           'Background Main',
        bgChat:           'Background Chat',
        bgSidebar:        'Background Sidebar'
    };
    const THEME_DEFAULTS = {
        light: { accentBrand: '#6C5DD3', accentBrandHover: '#5847B8', bgMain: '#EEECF7', bgChat: '#FAF7F2', bgSidebar: '#FBFAFE' },
        dark:  { accentBrand: '#9B8AFB', accentBrandHover: '#8171E8', bgMain: '#17151E', bgChat: '#15121C', bgSidebar: '#201C29' }
    };

    let themeData = null;
    let themeEditorMode = 'light';
    let activeView = 'dashboard';

    async function switchToTheme() {
        activeView = 'theme';
        document.getElementById('overviewGrid').style.display = 'none';
        document.querySelector('.dashboard-header').style.display = 'none';
        document.getElementById('widgetGrid').style.display = 'none';
        document.getElementById('themePanel').style.display = 'block';
        document.getElementById('themeNavRow').classList.add('active');
        renderDashboardList();
        if (!themeData) await loadThemeEditor();
        else renderThemeEditor();
    }

    function switchToDashboardView() {
        activeView = 'dashboard';
        document.getElementById('overviewGrid').style.display = '';
        document.querySelector('.dashboard-header').style.display = '';
        document.getElementById('widgetGrid').style.display = '';
        document.getElementById('themePanel').style.display = 'none';
        document.getElementById('themeNavRow').classList.remove('active');
        renderDashboardList();
        renderActiveDashboard();
    }

    async function loadThemeEditor() {
        try {
            themeData = await authFetchJSON('/api/admin/theme', 'GET');
        } catch (err) {
            showToast('Could not load theme: ' + err.message, 'error');
            themeData = JSON.parse(JSON.stringify(THEME_DEFAULTS));
        }
        renderThemeEditor();
    }

    function renderThemeEditor() {
        document.getElementById('themeTabLight').classList.toggle('active', themeEditorMode === 'light');
        document.getElementById('themeTabDark').classList.toggle('active', themeEditorMode === 'dark');

        const modeColors = (themeData && themeData[themeEditorMode]) || {};
        const grid = document.getElementById('themeColorGrid');
        grid.innerHTML = Object.keys(THEME_TOKEN_LABELS).map(key => {
            const val = modeColors[key] || THEME_DEFAULTS[themeEditorMode][key];
            return `
                <div class="color-token-row">
                    <div class="color-token-label">${THEME_TOKEN_LABELS[key]}</div>
                    <div class="color-token-inputs">
                        <input type="color" id="tc-${key}" value="${toHexColor(val)}" oninput="onThemeColorPicker('${key}', this.value)">
                        <input type="text" id="tc-text-${key}" value="${val}" onchange="onThemeColorText('${key}', this.value)" onblur="onThemeColorText('${key}', this.value)">
                    </div>
                </div>`;
        }).join('');

        updateThemePreview();
    }

    function toHexColor(val) {
        if (!val) return '#000000';
        const m = val.trim().match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
        return m ? (m[1].length === 3
            ? '#' + m[1].split('').map(c => c + c).join('')
            : val.trim()) : '#000000';
    }

    function onThemeColorPicker(key, value) {
        if (!themeData[themeEditorMode]) themeData[themeEditorMode] = {};
        themeData[themeEditorMode][key] = value;
        const textEl = document.getElementById('tc-text-' + key);
        if (textEl) textEl.value = value;
        updateThemePreview();
    }

    function onThemeColorText(key, value) {
        const v = value.trim();
        const hexRe = /^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;
        const rgbRe = /^rgba?\(\s*\d+\s*,\s*\d+\s*,\s*\d+(\s*,\s*(0|1|0?\.\d+))?\s*\)$/;
        if (hexRe.test(v) || rgbRe.test(v)) {
            if (!themeData[themeEditorMode]) themeData[themeEditorMode] = {};
            themeData[themeEditorMode][key] = v;
            const pickerEl = document.getElementById('tc-' + key);
            if (pickerEl) pickerEl.value = toHexColor(v);
            updateThemePreview();
        } else {
            const current = (themeData[themeEditorMode] || {})[key] || THEME_DEFAULTS[themeEditorMode][key];
            document.getElementById('tc-text-' + key).value = current;
        }
    }

    function updateThemePreview() {
        const mode = themeEditorMode;
        const colors = Object.assign({}, THEME_DEFAULTS[mode], (themeData && themeData[mode]) || {});
        const sidebar = document.getElementById('themePreviewSidebar');
        const chat = document.getElementById('themePreviewChat');
        const mock = document.getElementById('themePreviewMock');
        const bubbleOut = document.getElementById('themePreviewBubbleOut');
        if (mock) mock.style.background = colors.bgMain;
        if (sidebar) sidebar.style.background = colors.bgSidebar;
        if (chat) chat.style.background = colors.bgChat;
        if (bubbleOut) bubbleOut.style.background = colors.accentBrand;
    }

    function switchThemeEditorMode(mode) {
        themeEditorMode = mode;
        renderThemeEditor();
    }

    async function saveTheme() {
        try {
            await authFetchJSON('/api/admin/theme', 'PUT', themeData);
            showToast('Theme saved successfully.');
        } catch (err) {
            showToast('Save failed: ' + err.message, 'error');
        }
    }

    async function resetThemeDefaults() {
        if (!await showConfirm('Reset all colors to defaults? This cannot be undone.')) return;
        try {
            await authFetchJSON('/api/admin/theme', 'PUT', THEME_DEFAULTS);
            themeData = JSON.parse(JSON.stringify(THEME_DEFAULTS));
            renderThemeEditor();
            showToast('Theme reset to defaults.');
        } catch (err) {
            showToast('Reset failed: ' + err.message, 'error');
        }
    }

    init();
</script>
