services:
  local-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./local-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi,bn,ur
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=true
    ports:
      - "127.0.0.1:5005:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - ./frontend:/usr/src/app/public   # 🌟 ADD THIS EXACT MOUNT LINE
      - /usr/src/app/node_modules
      # Read-only: lets the container's multica CLI authenticate as this PC's
      # own already-logged-in Multica session instead of needing separate
      # container credentials. :ro so the container's CLI invocations can't
      # write into and disturb this PC's live daemon state (daemon.pid, logs).
      - C:/Users/gsudh/.multica:/root/.multica:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - TRANSLATE_URL=http://libretranslate:5000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES}
      # Ollama runs on the host (not in a container) -- host.docker.internal is
      # Docker Desktop's built-in route to it. extra_hosts below makes the same
      # hostname resolve on Linux Docker hosts too.
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_MODEL=llama3.2
      - KOKORO_TTS_URL=http://kokoro-tts:8880
      # Mika bridge — admin-only. These three vars must be set in .env for the
      # /api/admin/mika/message endpoint to be active (503 otherwise). The
      # backend talks to Multica via the `multica` CLI, not a REST token, so
      # the CLI itself must separately be installed + authenticated inside
      # this container (see .env.example for the manual provisioning note).
      - MULTICA_PROJECT_ID=${MULTICA_PROJECT_ID}
      - MIKA_AGENT_ID=${MIKA_AGENT_ID}
      - MIKA_PARENT_ISSUE_ID=${MIKA_PARENT_ISSUE_ID}
      - MULTICA_WORKSPACE_ID=${MULTICA_WORKSPACE_ID:-}
      - MULTICA_CLI_PATH=${MULTICA_CLI_PATH:-multica}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  # Sits between the Cloudflare Tunnel and local Ollama so the Render-hosted
  # backend can reach this PC's Ollama (private, free) as H's primary source,
  # falling back to Groq only when this machine/tunnel is unreachable. Ollama
  # itself has no auth, hence the proxy instead of exposing it directly.
  ollama-proxy:
    build: ./ollama-proxy
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - PROXY_SECRET=${OLLAMA_LOCAL_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jobboard:
    build: ./jobboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      - JOBS_FEED_URL=https://raw.githubusercontent.com/sudheer-050/HAI-messenger/master/jobs/feed.json
      - FEED_CACHE_TTL=300

  # Local Kokoro TTS inference — CPU-only, no cloud dependency.
  # Internal-only: backend reaches it as http://kokoro-tts:8880.
  # 127.0.0.1 host port is for manual smoke-testing only.
  # Voice is set via DEFAULT_VOICE; swap it in .env and restart without
  # rebuilding. Model weights (~82 MB) are cached in kokoro_models volume.
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    restart: unless-stopped
    environment:
      - DEFAULT_VOICE=${KOKORO_VOICE:-af_heart}
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - kokoro_models:/app/models

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - backend
      - ollama-proxy
      - jobboard

volumes:
  pgdata:
  libretranslate_models:
  kokoro_models: