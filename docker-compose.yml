services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi,bn,ur
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=true
    ports:
      - "127.0.0.1:5005:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - ./frontend:/usr/src/app/public   # 🌟 ADD THIS EXACT MOUNT LINE
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - TRANSLATE_URL=http://libretranslate:5000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES}
      # Ollama runs on the host (not in a container) -- host.docker.internal is
      # Docker Desktop's built-in route to it. extra_hosts below makes the same
      # hostname resolve on Linux Docker hosts too.
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_MODEL=llama3.2
      # Mika bridge — admin-only. All six vars must be set in .env for the
      # /api/admin/mika/message endpoint to be active (503 otherwise).
      - MULTICA_API_TOKEN=${MULTICA_API_TOKEN}
      - MULTICA_SERVER_URL=${MULTICA_SERVER_URL:-https://api.multica.ai}
      - MULTICA_WORKSPACE_ID=${MULTICA_WORKSPACE_ID}
      - MULTICA_PROJECT_ID=${MULTICA_PROJECT_ID}
      - MIKA_AGENT_ID=${MIKA_AGENT_ID}
      - MIKA_PARENT_ISSUE_ID=${MIKA_PARENT_ISSUE_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  # Sits between the Cloudflare Tunnel and local Ollama so the Render-hosted
  # backend can reach this PC's Ollama (private, free) as H's primary source,
  # falling back to Groq only when this machine/tunnel is unreachable. Ollama
  # itself has no auth, hence the proxy instead of exposing it directly.
  ollama-proxy:
    build: ./ollama-proxy
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - PROXY_SECRET=${OLLAMA_LOCAL_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jobboard:
    build: ./jobboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      - JOBS_FEED_URL=https://raw.githubusercontent.com/sudheer-050/HAI-messenger/master/jobs/feed.json
      - FEED_CACHE_TTL=300

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - backend
      - ollama-proxy
      - jobboard

volumes:
  pgdata:
  libretranslate_models: