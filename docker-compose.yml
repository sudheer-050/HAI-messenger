services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi,bn,ur
      LT_UPDATE_MODELS: 'true'
      LT_DISABLE_WEB_UI: 'true'
    volumes:
      - libretranslate_models:/home/libretranslate/.local

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    runtime: nvidia
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.render
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TRANSLATE_URL: http://libretranslate:5000
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      H_OLLAMA_TIMEOUT_MS: ${H_OLLAMA_TIMEOUT_MS:-45000}
      ENABLE_GEMINI_FALLBACK: ${ENABLE_GEMINI_FALLBACK:-false}
      NODE_ENV: production
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      H_CHAT_RATE_LIMIT: ${H_CHAT_RATE_LIMIT:-10}
      H_MAX_CONCURRENT_REQUESTS: ${H_MAX_CONCURRENT_REQUESTS:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL}
      KOKORO_TTS_URL: http://kokoro-tts:8880
      KOKORO_TTS_VOICE: ${KOKORO_TTS_VOICE:-af_heart}
      KOKORO_TTS_MAX_BYTES: ${KOKORO_TTS_MAX_BYTES:-5242880}
      TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
      KOKORO_VOICE: ${KOKORO_VOICE:-}
      KOKORO_VOICE_WARM: ${KOKORO_VOICE_WARM:-af_heart}
      KOKORO_VOICE_NEUTRAL: ${KOKORO_VOICE_NEUTRAL:-af_nova}
      KOKORO_VOICE_GENTLE: ${KOKORO_VOICE_GENTLE:-af_nicole}
      KOKORO_SPEED: ${KOKORO_SPEED:-1.0}
      H_TTS_MAX_CHARS: ${H_TTS_MAX_CHARS:-1200}
      H_TTS_MAX_PER_MINUTE: ${H_TTS_MAX_PER_MINUTE:-10}
      H_TTS_TIMEOUT_MS: ${H_TTS_TIMEOUT_MS:-25000}
      H_TTS_AUDIO_TTL_HOURS: ${H_TTS_AUDIO_TTL_HOURS:-24}
      TTS_STORAGE_DIR: /usr/src/app/tts-audio
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      MULTICA_PROJECT_ID: ${MULTICA_PROJECT_ID:-}
      MIKA_AGENT_ID: ${MIKA_AGENT_ID:-}
      MIKA_PARENT_ISSUE_ID: ${MIKA_PARENT_ISSUE_ID:-}
    volumes:
      - multica_config:/root/.multica
      - tts_audio:/usr/src/app/tts-audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      kokoro-tts:
        condition: service_started
    networks:
      default:
      ingress:
        aliases:
          - ${BACKEND_INGRESS_ALIAS}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  analyst:
    build:
      context: /home/bigserver/auto-data-analyst
    restart: unless-stopped
    environment:
      SECRET_KEY: ${ANALYST_SECRET_KEY}
    volumes:
      - analyst_uploads:/app/uploads
      - analyst_outputs:/app/outputs
    networks:
      default:
      ingress:
        aliases:
          - ${ANALYST_INGRESS_ALIAS}

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    restart: unless-stopped
    environment:
      DEFAULT_VOICE: ${KOKORO_VOICE:-af_heart}
    volumes:
      - kokoro_models:/app/models

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      backend:
        condition: service_healthy
      analyst:
        condition: service_started
    networks:
      - default
      - ingress

networks:
  ingress:
    external: true
    name: hurricane-chat-ingress

volumes:
  pgdata:
    name: ${PGDATA_VOLUME}
  redis_data:
    name: ${REDIS_VOLUME}
  libretranslate_models:
    name: ${LIBRETRANSLATE_VOLUME}
  ollama_data:
    name: ${OLLAMA_VOLUME}
  multica_config:
    name: ${MULTICA_VOLUME}
  analyst_uploads:
    name: ${ANALYST_UPLOADS_VOLUME}
  analyst_outputs:
    name: ${ANALYST_OUTPUTS_VOLUME}
  kokoro_models:
    name: ${KOKORO_MODELS_VOLUME}
  tts_audio:
    name: ${TTS_AUDIO_VOLUME}
