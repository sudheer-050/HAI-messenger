services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      - LT_LOAD_ONLY=en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi,bn,ur
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=true
    ports:
      - "127.0.0.1:5005:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - ./frontend:/usr/src/app/public   # 🌟 ADD THIS EXACT MOUNT LINE
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - TRANSLATE_URL=http://libretranslate:5000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES}
    depends_on:
      - postgres
      - redis

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - backend

volumes:
  pgdata:
  libretranslate_models: